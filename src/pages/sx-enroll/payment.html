  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white dark:bg-gray-900 lg:h-screen lg:flex-row lg:overflow-hidden">

    <div data-ob-sidebar></div>

    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <div data-ob-content class="flex flex-1 flex-col gap-14">
          <div class="flex flex-col gap-6 px-4 pt-10 lg:gap-9 lg:px-14 lg:pt-14">
          <section aria-label="Payment amount" data-ob-tone="dark"
            class="relative w-full overflow-hidden rounded-2xl bg-[linear-gradient(149deg,#3773ff_3.3%,#2254ca_99.2%)] shadow-xl">
            <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 h-[172px] overflow-hidden rounded-2xl">
              <span class="absolute top-[calc(50%-72px)] left-[calc(50%-113.5px)] flex size-[198.7px] -translate-x-1/2 -translate-y-1/2 items-center justify-center">
                <img src="../../assets/onboarding/bubble-1.svg" alt="" width="162.266" height="162.266" class="block max-w-none -rotate-[105deg]">
              </span>
              <span class="absolute top-[calc(50%+95.81px)] left-[calc(50%-109.55px)] flex size-[143.1px] -translate-x-1/2 -translate-y-1/2 items-center justify-center">
                <img src="../../assets/onboarding/bubble-2.svg" alt="" width="116.858" height="116.858" class="block max-w-none -rotate-[105deg]">
              </span>
              <span class="absolute top-[calc(50%+27.25px)] left-[calc(50%+161.16px)] flex size-[180.2px] -translate-x-1/2 -translate-y-1/2 items-center justify-center">

              </span>
            </div>
            <div class="relative flex flex-col items-center gap-3 px-5 pt-6 pb-6">
              <p class="type-overline text-blue-200">Payment amount</p>
              <p class="text-5xl leading-12 whitespace-nowrap"><span data-pay-integer data-ob-skeleton="text" class="inline-block align-top text-white">$3,526</span><span data-pay-decimal data-ob-skeleton="decimal" class="inline-block align-top text-blue-300">.00</span></p>
              <p class="flex items-center gap-1.5 rounded-full bg-blue-800 px-4 py-1 whitespace-nowrap">
                <span class="text-[10px] leading-4 font-medium tracking-wider text-blue-400 uppercase">From</span>
                <span data-ob-skeleton data-pay-sender class="text-sm leading-5 text-white">Horizon Inc</span>
              </p>
            </div>
          </section>

          <!-- Message / Expiration / Contact Details -->
          <div class="flex w-full justify-center gap-2 max-[359px]:gap-1.5 lg:px-4">
            <button type="button" data-pay-chip="message" class="flex min-w-0 cursor-pointer items-center justify-center gap-1 rounded-full bg-gray-50 dark:bg-white/5 px-2.5 max-[359px]:flex-1 md:flex-1 py-[9px] text-sm leading-5 font-medium max-[359px]:gap-0.5 max-[359px]:px-1.5 max-[359px]:text-[13px] whitespace-nowrap text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">
              <img src="../../assets/onboarding/icon-mail-chip.svg" alt="" width="18" height="18" class="size-[18px] shrink-0 max-[359px]:size-4">Message
            </button>
            <button type="button" data-pay-chip="expiration" class="flex min-w-0 cursor-pointer items-center justify-center gap-1 rounded-full bg-gray-50 dark:bg-white/5 px-2.5 max-[359px]:flex-1 md:flex-1 py-[9px] text-sm leading-5 font-medium max-[359px]:gap-0.5 max-[359px]:px-1.5 max-[359px]:text-[13px] whitespace-nowrap text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">

            <button type="button" data-ob-contact class="flex min-w-0 cursor-pointer items-center justify-center gap-1 rounded-full bg-gray-50 dark:bg-white/5 px-2.5 max-[359px]:flex-1 md:flex-1 py-[9px] text-sm leading-5 font-medium max-[359px]:gap-0.5 max-[359px]:px-1.5 max-[359px]:text-[13px] whitespace-nowrap text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">
              <img src="../../assets/onboarding/icon-menu-chip.svg" alt="" width="18" height="18" class="size-[18px] shrink-0 max-[359px]:size-4">Contact Details
            </button>
          </div>

          <!-- Payment method (SD method row) -->
          <div class="flex w-full flex-col gap-4">
            <h2 class="type-title-card text-default">Choose your payment method</h2>
            <ul role="list" class="flex w-full flex-col gap-2">
              <li>
                <button type="button" data-sx-method class="group flex w-full cursor-pointer items-center gap-4 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-gray-900 p-3 text-left hover:bg-gray-50 dark:hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">
                  <span class="flex min-w-0 flex-1 items-center gap-3">
                    <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-gray-50 dark:bg-white/5">
                      <img src="../../assets/onboarding/icon-credit-card-outline.svg" alt="" width="24" height="24" class="size-6">
                    </span>
                    <span class="flex min-w-0 flex-col items-start gap-0.5">
                      <span class="text-sm leading-5 font-semibold text-gray-900 dark:text-white">Accept Card Payment</span>
                      <span class="text-xs leading-4 text-gray-500 dark:text-gray-400">No bank account details required, immediate</span>
                    </span>
                  </span>
                  <img src="../../assets/onboarding/icon-chevron-right-gray.svg" alt="" width="20" height="20" class="size-5 shrink-0 transition duration-200 ease-out group-hover:translate-x-1 group-hover:brightness-[0.8] group-focus-visible:translate-x-1 group-focus-visible:brightness-[0.8] motion-reduce:transition-none">
                </button>
