<!--
  @file onboarding/debit-account-info.html
  @description Send to my Bank Account — Step 2: Bank Account Details
-->
<!doctype html>
<html class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // The payable context has to be resolved before the form is built,
      // otherwise the vendor's details are not there to prefill with.
      Promise.resolve(window.SDOnboardingContext && window.SDOnboardingContext.bootstrap
        ? window.SDOnboardingContext.bootstrap()
        : null).catch(function () {}).then(initPage);

    function initPage() {
      var KEY = 'sd-onboarding-state';
      var nextButton = document.getElementById('next-button');
      var backLink = document.getElementById('back-link');
      var titleNode = document.getElementById('step-title');
      var descNode = document.getElementById('step-description');
      var bankIntroIllustration = document.getElementById('bank-intro-illustration');
      var routingTooltip = document.getElementById('routing-tooltip');
      var routingTooltipArrow = document.getElementById('routing-tooltip-arrow');
      var accountTooltip = document.getElementById('account-tooltip');
      var accountTooltipArrow = document.getElementById('account-tooltip-arrow');
      var bankForm = document.getElementById('bank-form');
      var accountInfoForm = document.getElementById('account-info-form');
      var mismatchNode = document.getElementById('bank-account-mismatch');
      var leadingCompleteItem = document.getElementById('substep-leading-complete-item');
      var leadingCompleteLabel = document.getElementById('substep-leading-complete-label');
      var currentSubstepLabel = document.getElementById('current-substep-label');
      var upcomingItem = document.getElementById('substep-upcoming-item');
      var upcomingLabel = document.getElementById('substep-upcoming-label');

      function getState() {
        try { return JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
      }
      function saveState(patch) {
        var s = getState(); Object.assign(s, patch); sessionStorage.setItem(KEY, JSON.stringify(s));
      }
      function formatCurrency(value, currency) {
        var n = Number(String(value).replace(/[^0-9.-]/g, ''));
        if (!Number.isFinite(n)) return '$3,526.00';
        try {
          return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: currency || 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }).format(n);
        } catch (e) {
          return '$' + n.toFixed(2);
        }
      }

      var state = getState();
      var isBankMethod = state.paymentMethod === 'bank-account';
      var amount = formatCurrency(state.amount || state.paymentAmount || '3526.00', 'USD');
      var bankFlowStep = isBankMethod && state.bankFlowStep === 'account-information' ? 'account-information' : 'bank-details';
      var syncUi = function () {};
      var evaluateBank = function () { return false; };
      var evaluateAccountInfo = function () { return false; };

      function renderBankStep(step) {
        var isBankDetails = step === 'bank-details';
        if (leadingCompleteItem) leadingCompleteItem.classList.toggle('hidden', isBankDetails);
        if (leadingCompleteLabel) leadingCompleteLabel.textContent = 'Bank Details';
        if (currentSubstepLabel) currentSubstepLabel.textContent = isBankDetails ? 'Bank Details' : 'Account Information';
        if (upcomingItem) upcomingItem.classList.toggle('hidden', !isBankDetails);
        if (upcomingLabel) upcomingLabel.textContent = 'Account Information';
        if (titleNode) titleNode.innerHTML = isBankDetails ? 'Enter Your<br>Bank Account Details' : 'Account Information';
        if (descNode) {
          descNode.innerHTML = isBankDetails
            ? ('<span class="font-semibold text-gray-700">' + amount + '</span> will be deposited to your bank account.')
            : 'This information will be used to register your card and process the deposit.';
        }
        if (bankIntroIllustration) bankIntroIllustration.classList.toggle('hidden', !isBankDetails);
        if (bankForm) bankForm.classList.toggle('hidden', !isBankDetails);
        if (accountInfoForm) accountInfoForm.classList.toggle('hidden', isBankDetails);
        if (backLink) backLink.setAttribute('href', isBankDetails ? 'paywall.html' : 'debit-account-info.html');
      }

      function persistBank(bank) { saveState({ bankAccount: Object.assign({}, bank) }); }

      function setRoutingBadgeTone(tone) {
        if (routingTooltip) {
          routingTooltip.classList.toggle('bg-blue-600', tone === 'active');
          routingTooltip.classList.toggle('bg-gray-400', tone === 'muted');
          routingTooltip.classList.toggle('bg-gray-900', tone !== 'active' && tone !== 'muted');
        }
        if (routingTooltipArrow) {
          routingTooltipArrow.classList.toggle('border-t-blue-600', tone === 'active');
          routingTooltipArrow.classList.toggle('border-t-gray-400', tone === 'muted');
          routingTooltipArrow.classList.toggle('border-t-gray-900', tone !== 'active' && tone !== 'muted');
        }
      }

      function setAccountBadgeTone(tone) {
        if (accountTooltip) {
          accountTooltip.classList.toggle('bg-blue-600', tone === 'active');
          accountTooltip.classList.toggle('bg-gray-400', tone === 'muted');
          accountTooltip.classList.toggle('bg-gray-900', tone !== 'active' && tone !== 'muted');
        }
        if (accountTooltipArrow) {
          accountTooltipArrow.classList.toggle('border-t-blue-600', tone === 'active');
          accountTooltipArrow.classList.toggle('border-t-gray-400', tone === 'muted');
          accountTooltipArrow.classList.toggle('border-t-gray-900', tone !== 'active' && tone !== 'muted');
        }
      }

      function initBankForm() {
        var defaults = Object.assign({
          accountType: '',
          accountHolderName: '',
          routingNumber: '',
          accountNumber: '',
          verifyAccountNumber: ''
        }, (state.payableContext && state.payableContext.bankAccount) || {});
        var saved = state.bankAccount || {};
        var bank = {
          accountType: String(saved.accountType || defaults.accountType),
          accountHolderName: String(saved.accountHolderName || defaults.accountHolderName),
          routingNumber: String(saved.routingNumber || defaults.routingNumber),
          accountNumber: String(saved.accountNumber || defaults.accountNumber),
          verifyAccountNumber: String(saved.verifyAccountNumber || saved.accountNumber || defaults.verifyAccountNumber)
        };

        function updateNextState() {
          var hasType = bank.accountType === 'checking' || bank.accountType === 'savings';
          var holderReady = bank.accountHolderName.trim() !== '';
          var routingReady = bank.routingNumber.trim().length >= 4;
          var accountReady = bank.accountNumber.trim().length >= 4;
          var verifyReady = bank.verifyAccountNumber.trim().length >= 4;
          var matches = bank.accountNumber.trim() !== '' && bank.accountNumber === bank.verifyAccountNumber;
          if (mismatchNode) mismatchNode.classList.toggle('hidden', matches || !verifyReady);
          return !!(hasType && holderReady && routingReady && accountReady && verifyReady && matches);
        }

        var typeChecking = document.getElementById('account-type-checking');
        var typeSavings = document.getElementById('account-type-savings');
        if (typeChecking) {
          typeChecking.checked = bank.accountType === 'checking';
          typeChecking.addEventListener('change', function () {
            if (!typeChecking.checked) return;
            bank.accountType = 'checking';
            persistBank(bank);
            syncUi();
          });
        }
        if (typeSavings) {
          typeSavings.checked = bank.accountType === 'savings';
          typeSavings.addEventListener('change', function () {
            if (!typeSavings.checked) return;
            bank.accountType = 'savings';
            persistBank(bank);
            syncUi();
          });
        }

        var holderInput = document.getElementById('bank-account-holder-name');
        var routingInput = document.getElementById('bank-routing-number');
        var accountInput = document.getElementById('bank-account-number');
        var verifyInput = document.getElementById('bank-account-number-verify');

        if (holderInput) {
          holderInput.value = bank.accountHolderName;
          holderInput.addEventListener('input', function () {
            bank.accountHolderName = holderInput.value;
            persistBank(bank);
            syncUi();
          });
        }
        if (routingInput) {
          routingInput.value = bank.routingNumber;
          routingInput.addEventListener('focus', function () {
            setRoutingBadgeTone('active');
            setAccountBadgeTone('muted');
          });
          routingInput.addEventListener('blur', function () {
            setRoutingBadgeTone('default');
            setAccountBadgeTone(document.activeElement === accountInput || document.activeElement === verifyInput ? 'active' : 'default');
          });
          routingInput.addEventListener('input', function () {
            routingInput.value = routingInput.value.replace(/\D/g, '').slice(0, 9);
            bank.routingNumber = routingInput.value;
            persistBank(bank);
            syncUi();
          });
        }
        if (accountInput) {
          accountInput.value = bank.accountNumber;
          accountInput.addEventListener('focus', function () {
            setAccountBadgeTone('active');
            setRoutingBadgeTone('muted');
          });
          accountInput.addEventListener('blur', function () {
            if (document.activeElement !== verifyInput) {
              setAccountBadgeTone('default');
              setRoutingBadgeTone(document.activeElement === routingInput ? 'active' : 'default');
            }
          });
          accountInput.addEventListener('input', function () {
            accountInput.value = accountInput.value.replace(/\D/g, '').slice(0, 17);
            bank.accountNumber = accountInput.value;
            persistBank(bank);
            updateNextState();
          });
        }
        if (verifyInput) {
          verifyInput.value = bank.verifyAccountNumber;
          verifyInput.addEventListener('focus', function () {
            setAccountBadgeTone('active');
            setRoutingBadgeTone('muted');
          });
          verifyInput.addEventListener('blur', function () {
            if (document.activeElement !== accountInput) {
              setAccountBadgeTone('default');
              setRoutingBadgeTone(document.activeElement === routingInput ? 'active' : 'default');
            }
          });
          verifyInput.addEventListener('input', function () {
            verifyInput.value = verifyInput.value.replace(/\D/g, '').slice(0, 17);
            bank.verifyAccountNumber = verifyInput.value;
            persistBank(bank);
            syncUi();
          });
        }
        persistBank(bank);
        evaluateBank = updateNextState;
      }

      function initAccountInfoForm() {
        var requiredIds = ['firstName', 'lastName', 'addressLine1', 'city', 'state', 'zipCode', 'country', 'phoneNumber', 'email'];
        var defaults = Object.assign({
          firstName: '',
          lastName: '',
          phoneNumber: '',
          email: '',
          addressLine1: '',
          addressLine2: '',
          city: '',
          state: '',
          zipCode: '',
          country: 'United States'
        }, (state.payableContext && state.payableContext.accountInformation) || {});
        var saved = state.virtualCard || {};
        var current = {};

        function updateNextState() {
          var allFilled = requiredIds.every(function (id) {
            var el = document.getElementById(id);
            return el && el.value.trim() !== '';
          });
          return allFilled;
        }

        requiredIds.concat(['addressLine2']).forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          el.value = saved[id] || defaults[id] || '';
          current[id] = el.value;
          function onChange() {
            var next = getState().virtualCard || {};
            next[id] = el.value;
            saveState({ virtualCard: next });
            syncUi();
          }
          el.addEventListener('input', onChange);
          el.addEventListener('change', onChange);
        });
        saveState({ virtualCard: current });
        evaluateAccountInfo = updateNextState;
      }

      function updateNextButtonState() {
        if (isBankMethod) {
          nextButton.disabled = bankFlowStep === 'bank-details' ? !evaluateBank() : !evaluateAccountInfo();
          return;
        }
        nextButton.disabled = !evaluateAccountInfo();
      }

      syncUi = function () {
        if (isBankMethod) renderBankStep(bankFlowStep);
        else {
          if (leadingCompleteItem) leadingCompleteItem.classList.remove('hidden');
          if (leadingCompleteLabel) leadingCompleteLabel.textContent = 'Card Details';
          if (currentSubstepLabel) currentSubstepLabel.textContent = 'Account Information';
          if (upcomingItem) upcomingItem.classList.add('hidden');
          if (titleNode) titleNode.innerHTML = 'Account Information';
          if (descNode) descNode.textContent = 'This information will be used to register your card and process the deposit.';
          if (bankIntroIllustration) bankIntroIllustration.classList.add('hidden');
          if (bankForm) bankForm.classList.add('hidden');
          if (accountInfoForm) accountInfoForm.classList.remove('hidden');
          if (backLink) backLink.setAttribute('href', 'debit-card-details.html');
        }
        updateNextButtonState();
      };

      backLink.addEventListener('click', function (event) {
        if (!(isBankMethod && bankFlowStep === 'account-information')) return;
        event.preventDefault();
        bankFlowStep = 'bank-details';
        saveState({ bankFlowStep: bankFlowStep });
        syncUi();
      });

      nextButton.addEventListener('click', function () {
        if (nextButton.disabled) return;
        if (isBankMethod && bankFlowStep === 'bank-details') {
          bankFlowStep = 'account-information';
          saveState({ bankFlowStep: bankFlowStep });
          syncUi();
          return;
        }
        window.location.href = 'summary.html';
      });

      initBankForm();
      initAccountInfoForm();
      if (!isBankMethod) saveState({ bankFlowStep: '' });
      syncUi();
    }
    });
  </script>
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto max-w-[1024px] w-full min-h-screen bg-white flex flex-col lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex-1 flex flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <!-- Content area -->
        <div data-ob-content class="flex-1 flex flex-col items-center px-4 pt-10 pb-8 lg:px-10 lg:pt-12">
          <div class="w-full max-w-[640px]">

            <h1 id="step-title" class="text-3xl font-semibold text-gray-900">Account Information</h1>
            <p id="step-description" class="mt-2 text-sm text-gray-500">This information will be used to register your card and process the deposit.</p>
            <div id="bank-intro-illustration" class="mt-6 hidden">
              <div class="relative w-full min-w-[343px] max-w-[347px]">
                <img src="../../assets/illustrations/Check.svg" alt="Bank deposit illustration" class="w-full h-auto" />
                <div class="pointer-events-none absolute left-[12px] top-[114px] inline-flex -translate-y-full flex-col items-center">
                  <div id="routing-tooltip" class="rounded-md bg-gray-900 px-2.5 py-1.5 text-xs font-medium text-white shadow-lg transition-colors">
                    9-Digit Routing #
                  </div>
                  <div id="routing-tooltip-arrow" class="h-0 w-0 border-x-[6px] border-t-[8px] border-x-transparent border-t-gray-900 transition-colors"></div>
                </div>
                <div class="pointer-events-none absolute left-[142px] top-[114px] inline-flex -translate-y-full flex-col items-center">
                  <div id="account-tooltip" class="rounded-md bg-gray-900 px-2.5 py-1.5 text-xs font-medium text-white shadow-lg transition-colors">
                    3-17 Digit Account #
                  </div>
                  <div id="account-tooltip-arrow" class="h-0 w-0 border-x-[6px] border-t-[8px] border-x-transparent border-t-gray-900 transition-colors"></div>
                </div>
              </div>
            </div>

            <div id="bank-form" data-ob-skeleton-region class="mt-10 hidden space-y-6">
              <fieldset>
                <legend class="text-sm/6 font-semibold text-gray-900">Account Type</legend>
                <div class="mt-3 flex items-center gap-8">
                  <div class="flex items-center">
                    <input id="account-type-checking" type="radio" name="account-type" checked class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-blue-600 checked:bg-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:border-gray-300 disabled:bg-gray-100 disabled:before:bg-gray-400 forced-colors:appearance-auto forced-colors:before:hidden" />
                    <label for="account-type-checking" class="ml-3 block text-sm/6 font-medium text-gray-900">Checking</label>
                  </div>
                  <div class="flex items-center">
                    <input id="account-type-savings" type="radio" name="account-type" class="relative size-4 appearance-none rounded-full border border-gray-300 bg-white before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden checked:border-blue-600 checked:bg-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:border-gray-300 disabled:bg-gray-100 disabled:before:bg-gray-400 forced-colors:appearance-auto forced-colors:before:hidden" />
                    <label for="account-type-savings" class="ml-3 block text-sm/6 font-medium text-gray-900">Savings</label>
                  </div>
                </div>
              </fieldset>

              <div class="sm:max-w-[430px]">
                <label for="bank-account-holder-name" class="block text-sm/6 font-medium text-gray-900">Account Holder Name</label>
                <div class="mt-2">
                  <input id="bank-account-holder-name" type="text" name="bank-account-holder-name" class="block w-full rounded-md bg-white py-1.5 px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                </div>
              </div>

              <div class="sm:max-w-[430px]">
                <label for="bank-routing-number" class="block text-sm/6 font-medium text-gray-900">Routing Number</label>
                <div class="mt-2 grid grid-cols-1">
                  <input id="bank-routing-number" type="text" name="bank-routing-number" inputmode="numeric" placeholder="000000000" class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pr-3 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                </div>
              </div>

              <div class="sm:max-w-[430px]">
                <label for="bank-account-number" class="block text-sm/6 font-medium text-gray-900">Account Number</label>
                <div class="mt-2 grid grid-cols-1">
                  <input id="bank-account-number" type="text" name="bank-account-number" inputmode="numeric" placeholder="000-00-0000" class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pr-3 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                </div>
              </div>

              <div class="sm:max-w-[430px]">
                <label for="bank-account-number-verify" class="block text-sm/6 font-medium text-gray-900">Verify Account Number</label>
                <div class="mt-2 grid grid-cols-1">
                  <input id="bank-account-number-verify" type="text" name="bank-account-number-verify" inputmode="numeric" placeholder="000-00-0000" class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pr-3 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                </div>
                <p id="bank-account-mismatch" class="mt-2 hidden text-sm text-red-600">Account numbers do not match.</p>
              </div>
            </div>

            <div id="account-info-form" data-ob-skeleton-region class="mt-10 space-y-8">
              <div>
                <div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">

                  <div class="sm:col-span-3">
                    <label for="firstName" class="block text-sm/6 font-medium text-gray-900">First name</label>
                    <div class="mt-2">
                      <input id="firstName" type="text" name="firstName" autocomplete="given-name" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                    </div>
                  </div>

                  <div class="sm:col-span-3">
                    <label for="lastName" class="block text-sm/6 font-medium text-gray-900">Last name</label>
                    <div class="mt-2">
                      <input id="lastName" type="text" name="lastName" autocomplete="family-name" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                    </div>
                  </div>

                  <div class="sm:col-span-4">
                    <label for="phoneNumber" class="block text-sm/6 font-medium text-gray-900">Phone number</label>
                    <div class="mt-2">
                      <div class="flex rounded-md bg-white outline-1 -outline-offset-1 outline-gray-300 has-[input:focus-within]:outline-2 has-[input:focus-within]:-outline-offset-2 has-[input:focus-within]:outline-blue-600">
                        <div class="grid shrink-0 grid-cols-1 focus-within:relative">
                          <select id="phoneCountry" name="phoneCountry" aria-label="Country code" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-7 pl-3 text-base text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6">
                            <option>US</option><option>CA</option><option>EU</option>
                          </select>
                          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
                            <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
                          </svg>
                        </div>
                        <input id="phoneNumber" type="text" name="phoneNumber" autocomplete="tel" placeholder="+1 (555) 000-0000" class="block min-w-0 grow bg-white py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6" />
                      </div>
                    </div>
                  </div>

                  <div class="sm:col-span-4">
                    <label for="email" class="block text-sm/6 font-medium text-gray-900">Email address</label>
                    <div class="mt-2">
                      <input id="email" type="email" name="email" autocomplete="email" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                    </div>
                  </div>

                </div>
              </div>

              <hr class="border-gray-900/10">

              <div>
                <h2 class="text-base/7 font-semibold text-gray-900">Mailing Address</h2>
                <p class="mt-1 text-sm/6 text-gray-600">Use a permanent address where you can receive mail.</p>

                <div class="mt-6 grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">
                  <div class="col-span-full">
                    <label for="addressLine1" class="block text-sm/6 font-medium text-gray-900">Address Line 1</label>
                    <div class="mt-2">
                      <input id="addressLine1" type="text" name="addressLine1" autocomplete="street-address" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                    </div>
                  </div>

                  <div class="col-span-full">
                    <div class="flex items-baseline justify-between">
                      <label for="addressLine2" class="block text-sm/6 font-medium text-gray-900">Address Line 2</label>
                      <span class="text-sm/6 text-gray-400">Optional</span>
                    </div>
                    <div class="mt-2">
                      <input id="addressLine2" type="text" name="addressLine2" autocomplete="address-line2" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                    </div>

                  <div class="sm:col-span-2 sm:col-start-1">
                    <label for="city" class="block text-sm/6 font-medium text-gray-900">City</label>

                      <input id="city" type="text" name="city" autocomplete="address-level2" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />

                      <select id="state" name="state" autocomplete="address-level1" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6">

                        <option>HI</option><option>ID</option><option>IL</option><option>IN</option><option>IA</option>
                        <option>KS</option><option>KY</option><option>LA</option><option>ME</option><option>MD</option>
                        <option>MA</option><option>MI</option><option>MN</option><option>MS</option><option>MO</option>
                        <option>MT</option><option>NE</option><option>NV</option><option>NH</option><option>NJ</option>
                        <option>NM</option><option>NY</option><option>NC</option><option>ND</option><option>OH</option>
                        <option>OK</option><option>OR</option><option>PA</option><option>RI</option><option>SC</option>
                        <option>SD</option><option>TN</option><option>TX</option><option>UT</option><option>VT</option>
                        <option>VA</option><option>WA</option><option>WV</option><option>WI</option><option>WY</option>
                      </select>
                      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4">
                        <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />
                      </svg>
                    </div>
                  </div>

                  <div class="sm:col-span-2">
                    <label for="zipCode" class="block text-sm/6 font-medium text-gray-900">ZIP Code</label>
                    <div class="mt-2">
                      <input id="zipCode" type="text" name="zipCode" autocomplete="postal-code" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                    </div>
                  </div>

                  <div class="sm:col-span-3">
                    <label for="country" class="block text-sm/6 font-medium text-gray-900">Country</label>
                    <div class="mt-2 grid grid-cols-1">
                      <select id="country" name="country" autocomplete="country-name" class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6">
                        <option value=""></option>
                        <option>United States</option><option>Canada</option><option>United Kingdom</option>

                        <path d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" fill-rule="evenodd" />

          <div class="w-full max-w-[640px] mt-auto pt-10 pb-6">

              <button id="next-button" type="button" disabled class="inline-flex h-11 flex-1 items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">
