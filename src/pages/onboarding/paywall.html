<!--
  @file onboarding/paywall.html
  @description Step 4 "Receive Payment" (Figma "4. Receive Payment",
    node 19484:89366). Shows the payment amount, Message / Expiration /
    Contact Us details, and the payment methods. Content comes from
    src/data/sd-payment.json; logic in src/scripts/paywall.js.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive Payment · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/paywall.js"></script>
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <div data-ob-content class="flex flex-1 flex-col gap-6 px-4 pt-10 pb-6 lg:gap-9 lg:px-14 lg:pt-14 lg:pb-14">

          <!-- Payment amount card -->
          <section aria-label="Payment amount" data-ob-tone="dark"
            class="relative w-full overflow-hidden rounded-2xl bg-[linear-gradient(149deg,#3773ff_3.3%,#2254ca_99.2%)] drop-shadow-[-3px_20px_12.5px_rgba(0,0,0,0.1)]">
            <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-0 h-[172px] overflow-hidden rounded-2xl">
              <span class="absolute top-[calc(50%-72px)] left-[calc(50%-113.5px)] flex size-[198.7px] -translate-x-1/2 -translate-y-1/2 items-center justify-center">
                <img src="../../assets/onboarding/bubble-1.svg" alt="" width="162.266" height="162.266" class="block max-w-none -rotate-[105deg]">
              </span>
              <span class="absolute top-[calc(50%+95.81px)] left-[calc(50%-109.55px)] flex size-[143.1px] -translate-x-1/2 -translate-y-1/2 items-center justify-center">
                <img src="../../assets/onboarding/bubble-2.svg" alt="" width="116.858" height="116.858" class="block max-w-none -rotate-[105deg]">
              </span>
              <span class="absolute top-[calc(50%+27.25px)] left-[calc(50%+161.16px)] flex size-[180.2px] -translate-x-1/2 -translate-y-1/2 items-center justify-center">
                <img src="../../assets/onboarding/bubble-3.svg" alt="" width="147.167" height="147.167" class="block max-w-none -rotate-[105deg]">
              </span>
            </div>
            <div class="relative flex flex-col items-center gap-3 px-5 pt-6 pb-8">
              <p class="text-xs leading-4 font-medium tracking-[0.6px] text-[#bfdbfe] uppercase">Payment amount</p>
              <p data-ob-skeleton class="text-5xl leading-[48px]"><span data-pay-integer class="text-white">$487</span><span data-pay-decimal class="text-[#3b82f6]">.00</span></p>
              <p class="flex items-center gap-1.5 rounded-full bg-[#1e40af] px-4 py-1 whitespace-nowrap">
                <span class="text-[10px] leading-4 font-medium tracking-[0.7px] text-[#60a5fa] uppercase">From</span>
                <span data-ob-skeleton data-pay-sender class="text-sm leading-5 text-white">Horizon Inc.</span>
              </p>
            </div>
          </section>

          <!-- Message / Expiration / Contact Us -->
          <div class="flex w-full gap-2 max-[359px]:gap-1.5 lg:px-4">
            <button type="button" data-pay-chip="message" class="flex min-w-0 flex-1 cursor-pointer items-center justify-center gap-1 rounded-full bg-[#f9fafb] px-2.5 py-[9px] text-sm leading-5 font-medium max-[359px]:gap-0.5 max-[359px]:px-1.5 max-[359px]:text-[13px] text-[#374151] hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
              <img src="../../assets/onboarding/icon-mail-chip.svg" alt="" width="18" height="18" class="size-[18px] shrink-0 max-[359px]:size-4">Message
            </button>
            <button type="button" data-pay-chip="expiration" class="flex min-w-0 flex-1 cursor-pointer items-center justify-center gap-1 rounded-full bg-[#f9fafb] px-2.5 py-[9px] text-sm leading-5 font-medium max-[359px]:gap-0.5 max-[359px]:px-1.5 max-[359px]:text-[13px] text-[#374151] hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
              <img src="../../assets/onboarding/icon-calendar-chip.svg" alt="" width="18" height="18" class="size-[18px] shrink-0 max-[359px]:size-4">Expiration
            </button>
            <button type="button" data-ob-contact class="flex min-w-0 flex-1 cursor-pointer items-center justify-center gap-1 rounded-full bg-[#f9fafb] px-2.5 py-[9px] text-sm leading-5 font-medium max-[359px]:gap-0.5 max-[359px]:px-1.5 max-[359px]:text-[13px] whitespace-nowrap text-[#374151] hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
              <img src="../../assets/onboarding/icon-menu-chip.svg" alt="" width="18" height="18" class="size-[18px] shrink-0 max-[359px]:size-4"><span class="lg:hidden">Full details</span><span class="hidden lg:inline">Contact Us</span>
            </button>
          </div>

          <!-- Payment methods -->
          <div class="flex w-full flex-col gap-4">
            <h1 class="text-base leading-6 font-semibold text-[#111827]">Choose your payment method:</h1>
            <ul data-pay-methods role="list" class="flex w-full flex-col gap-2"></ul>
          </div>
        </div>

        <!-- Footer: on desktop the sidebar carries it -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>

  </div>
</body>
</html>
