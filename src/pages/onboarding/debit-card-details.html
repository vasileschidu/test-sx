<!--
  @file onboarding/debit-card-details.html
  @description Send to my Debit Card · Card Details (Figma "Debit Card",
    node 21923:104799, "9. MC Send - Card Details"): name, card number and
    expiry, with the field errors and the "card details are invalid" alert.
    Content from Figma, styling as the other payment flows. Logic:
    src/scripts/debit-card.js, content: src/data/sd-debit.json.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debit Card Details · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/onboarding-substeps.js"></script>
  <script src="../../../src/scripts/onboarding-debit.js"></script>
  <script src="../../../src/scripts/debit-card.js"></script>
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <form id="debit-form" novalidate data-ob-content class="flex flex-1 flex-col gap-14">

          <div class="flex flex-col gap-9 px-4 pt-10 lg:px-14 lg:pt-14">
            <div data-ob-substeps-desktop data-ob-substeps="Card Details|Account Information|Summary" data-ob-substep="0"></div>

            <div class="flex w-full flex-col gap-6">
              <div class="flex w-full flex-col gap-3">
                <h1 class="text-3xl leading-9 text-[#1f2937]">Enter Your <span class="font-semibold">Debit Card Details</span></h1>
                <p class="text-sm leading-5 text-[#6b7280]"><span data-ob-skeleton data-debit-amount class="font-medium text-[#1f2937]">$487.00</span> will be deposited directly to your bank account using your debit card</p>
                <p data-debit-fee hidden class="text-sm leading-5 text-[#6b7280]">A <span data-debit-fee-amount class="font-medium">$0.00</span> fee will be charged</p>
              </div>

              <!-- Fields, rendered by debit-card.js -->
              <div data-debit-fields class="flex w-full flex-col gap-6"></div>

              <!-- "Card details are invalid" -->
              <div data-debit-alert hidden></div>
            </div>
          </div>

          <!-- Actions -->
          <div class="mt-auto flex flex-col items-center gap-6 px-4 pb-6 lg:px-14 lg:pb-14">
            <div class="flex w-full gap-8">
              <a href="paywall.html"
                class="hidden flex-1 items-center justify-center rounded-[10px] border border-gray-300 bg-white px-[25px] py-4 text-base leading-6 font-medium text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 lg:flex">Back</a>
              <button type="submit"
                class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-[10px] bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] py-4 pr-[23px] pl-[25px] text-base leading-6 font-medium text-white shadow-xs hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                Next
                <img src="../../assets/onboarding/icon-arrow-narrow-right.svg" alt="" width="20" height="20" class="size-5">
              </button>
            </div>
            <a href="bank-details.html"
              class="rounded-md px-2.5 py-1.5 text-sm leading-5 text-[#2563eb] hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
              I'd rather use my <span class="font-semibold text-[#3671fb]">routing and account</span> number
            </a>
          </div>
        </form>

        <!-- Footer: on desktop the sidebar carries it -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>

  </div>
</body>
</html>
