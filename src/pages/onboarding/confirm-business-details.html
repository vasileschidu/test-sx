<!--
  @file onboarding/confirm-business-details.html
  @description Step 2 "Confirm Identity" (Figma "2. Confirm Identity",
    node 19468:87018). The payee answers a few questions (claim number, last
    4 digits of SSN, mailing zip code). Fields come from src/data/sd-identity.json
    and are rendered by src/scripts/confirm-business-details.js. Too many wrong
    submissions lead to revoked.html.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Identity · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/confirm-business-details.js"></script>
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <form id="identity-form" novalidate data-ob-content class="flex flex-1 flex-col gap-14">

          <div class="flex flex-col gap-6 px-4 pt-10 lg:gap-9 lg:px-14 lg:pt-14">
            <!-- Title + intro -->
            <div class="flex w-full max-w-[460px] flex-col gap-4">
              <h1 class="text-3xl leading-9 text-[#1f2937]">Let’s make sure<br><span class="font-semibold">it’s you!</span></h1>
              <p class="text-sm leading-5 text-gray-500">
                To collect your <span data-ob-skeleton data-identity-payment class="font-medium text-[#1f2937]">$487.00</span>, please give us a couple details
              </p>
            </div>

            <div class="flex w-full flex-col gap-6">
              <!-- Questions card: fields rendered from sd-identity.json -->
              <div data-identity-card class="flex w-full flex-col gap-4 rounded-[10px] border border-[#e8e8e8] px-4 py-6"></div>

              <!-- Shown after a submission with a wrong answer -->
              <div data-identity-alert role="alert" class="hidden w-full items-start gap-3 rounded-md bg-[#fef2f2] p-4">
                <img src="../../assets/onboarding/icon-exclamation-circle-info.svg" alt="" width="20" height="20" class="size-5 shrink-0">
                <p class="flex-1 text-sm leading-5 text-[#991b1b]">
                  At least one of the submitted answer(s) is invalid. You have <span data-identity-remaining>2</span> out of <span data-identity-max>3</span> attempts remaining.
                </p>
              </div>
            </div>
          </div>

          <!-- Actions: Next sits on the right half on desktop, full width on phones -->
          <div class="mt-auto flex px-4 pb-6 lg:px-14 lg:pb-14">
            <div class="flex w-full gap-8">
              <span class="hidden flex-1 lg:block" aria-hidden="true"></span>
              <button type="submit" data-identity-next disabled
                class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-[10px] bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] py-4 pr-[23px] pl-[25px] text-base leading-6 font-medium text-white shadow-xs hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:brightness-100">
                Next
                <img src="../../assets/onboarding/icon-arrow-narrow-right.svg" alt="" width="20" height="20" class="size-5">
              </button>
            </div>
          </div>
        </form>

        <!-- Footer: on desktop the sidebar carries it -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>

  </div>
</body>
</html>
