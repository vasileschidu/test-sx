<!--
  @file onboarding/bank-account-info.html
  @description Send to my Bank Account · Review Account Information (Figma
    "4.2. ACH" → Account Information, node 19555:47200). The same form as the
    Virtual Card's account information, grouped for the bank flow
    (data-vc-variant="bank"); rendered and validated by
    src/scripts/virtual-card.js. Next is bank-summary.html.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Information · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../../scripts/theme-init.js?v=20261109a"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script src="../../scripts/tailwind-theme.js"></script>
  <script src="../../../src/scripts/design-tokens.js"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js?v=20261013b"></script>
  <script src="../../../src/scripts/onboarding-transitions.js?v=20261106a"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js?v=20261106b"></script>
  <script src="../../../src/scripts/onboarding-field.js?v=20261106a"></script>
  <script src="../../../src/scripts/onboarding-modal.js?v=20261109a"></script>
  <script src="../../../src/scripts/onboarding-decline.js?v=20261109e"></script>
  <script src="../../../src/scripts/onboarding-flow.js?v=20261109f"></script>
  <script src="../../../src/scripts/onboarding-stepper.js?v=20261104a"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/onboarding-substeps.js?v=20261109c"></script>
  <script src="../../../src/scripts/virtual-card.js"></script>
  <link rel="stylesheet" href="../../../src/styles/cursor.css" />
    <link rel="stylesheet" href="../../styles/checkbox.css" />
      <script src="../../scripts/checkbox-component.js"></script>
  </head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6 dark:bg-gray-900 dark:lg:bg-gray-950">

  <!-- CONTAINER -->
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden dark:bg-gray-900">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <form id="vc-form" data-vc-variant="bank" novalidate data-ob-content class="flex flex-1 flex-col gap-14">

          <div class="flex flex-col gap-9 px-4 pt-10 lg:px-14 lg:pt-14">
            <div data-ob-substeps="Bank Details|Account Information|Summary" data-ob-substep="1"></div>

            <div class="flex w-full flex-col gap-6">
              <div class="flex w-full flex-col gap-4">
                <h1 class="text-3xl leading-9 text-gray-800 dark:text-white">Review <span class="font-semibold">Account Information</span></h1>
                <p class="text-sm leading-5 text-gray-500 dark:text-gray-400">Please fill in or edit your account information</p>
              </div>

              <!-- Field groups, rendered by virtual-card.js -->
              <div data-vc-sections class="flex w-full flex-col gap-4"></div>
            </div>
          </div>

          <!-- Actions -->
          <div class="mt-auto flex flex-col items-center gap-6 px-4 pb-6 lg:px-14 lg:pb-14">
            <div class="grid w-full grid-cols-1 gap-8 lg:grid-cols-2">
              <a href="bank-details.html"
                class="hidden flex-1 items-center justify-center rounded-md border border-gray-300 bg-white px-[25px] py-[15px] text-base leading-6 font-medium text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 lg:flex dark:border-white/10 dark:bg-white/5 dark:text-gray-300 dark:hover:bg-white/10">Back</a>
              <button type="submit"
                class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-md bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] py-4 pr-[23px] pl-[25px] text-base leading-6 font-medium text-white hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                Next
                <img src="../../assets/onboarding/icon-arrow-narrow-right.svg" alt="" width="20" height="20" class="size-5">
              </button>
            </div>
            <a href="debit-card-details.html"
              class="rounded-md px-2.5 py-1.5 text-sm leading-5 text-blue-600 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:text-blue-400">
              Route using my debit <span class="font-semibold text-[#3671fb] dark:text-blue-400">card number</span>
            </a>
          </div>
        </form>

        <!-- Footer: on desktop the sidebar carries it -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>

  </div>
</body>
</html>
