<!--
  @file onboarding/payment-closed.html
  @description Multi-Party payment that can no longer be allocated, in the
    SMART Disburse "Tokens" style (Figma section 20024:45679, same layout as
    declined.html): expired ("Expired Fallback - External Check", 20021:44974),
    revoked ("Revoked SQA", 20021:44514 / "Revoked Fallback - External Check",
    20021:44626), or cancelled because the primary party disputed the total
    (laid out like "Payment Declined", 19894:36664).
    Filled by src/scripts/onboarding-multi-party.js.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Unavailable · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js?v=20261013b"></script>
  <script src="../../../src/scripts/onboarding-transitions.js?v=20261021a"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js?v=20261021a"></script>

<body data-mp-page="closed" class="min-h-full bg-white font-['Inter'] antialiased lg:bg-[#f9fafb]">

    <div class="flex w-full max-w-[512px] flex-col gap-8 bg-white lg:rounded-lg lg:p-8">

      <div class="flex w-full flex-col gap-4">
        <div data-mp-closed-icon class="flex size-12 items-center justify-center rounded-full"></div>
        <h1 data-mp-closed-title class="text-2xl leading-8 font-semibold text-gray-900"></h1>
        <!-- Reason and / or Details -->
        <div data-mp-closed-info class="flex w-full flex-col gap-4 rounded-lg border border-gray-200 bg-gray-50 p-4"></div>
      </div>

      <div class="flex w-full flex-col gap-2">
        <p class="text-sm leading-5 text-gray-700">Need assistance?</p>
        <div data-client-contact class="flex w-full rounded-lg border border-gray-200 p-4"></div>
      </div>

      <div data-ob-language class="flex justify-center"></div>
    </div>
  </main>

</html>
