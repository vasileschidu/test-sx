<!--
  @file onboarding/review-documents.html
  @description Step 3 "Review Documents" (Figma "3. Review Documents",
    node 19468:87528). The payee opens each attachment in a viewer and marks it
    Done; Next only continues once every attachment is reviewed. Content comes
    from src/data/sd-documents.json; logic in src/scripts/review-documents.js.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Documents · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/review-documents.js"></script>
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <div data-ob-content class="flex flex-1 flex-col gap-14">

          <div class="flex flex-col gap-6 px-4 pt-10 lg:gap-9 lg:px-14 lg:pt-14">
            <!-- Title, intro and the client's message -->
            <div class="flex w-full flex-col gap-4">
              <h1 class="text-3xl leading-9 text-[#1f2937]">Review your<br><span data-docs-header class="font-semibold">documents</span></h1>
              <p class="text-sm leading-5 text-[#6b7280]">Please select to review the documents below before proceeding with your payment.</p>

              <div class="flex w-full flex-col gap-2 rounded-md bg-[#f9fafb] p-4">
                <button type="button" data-docs-message-toggle aria-expanded="true" aria-controls="docs-message"
                  class="flex w-full cursor-pointer items-center gap-1 rounded text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                  <img src="../../assets/onboarding/icon-chat-alt.svg" alt="" width="18" height="18" class="size-[18px] shrink-0">
                  <span class="flex-1"><span data-ob-skeleton data-docs-message-title class="text-sm leading-4 font-medium text-black">Documents</span></span>
                  <img data-docs-message-chevron src="../../assets/onboarding/icon-chevron-down-dark.svg" alt="" width="20" height="20" class="size-5 shrink-0 rotate-180 transition-transform duration-150">
                </button>
                <p id="docs-message" data-ob-skeleton data-docs-message class="text-sm leading-5 text-[#6b7280]"></p>
              </div>
            </div>

            <!-- Attachments + "still to review" alert -->
            <div class="flex w-full flex-col gap-6">
              <div class="flex w-full flex-col gap-2.5">
                <p class="text-xs leading-4 font-medium tracking-[0.6px] text-[#4b5563] uppercase">Attachments</p>
                <ul data-docs-list role="list" class="flex w-full flex-col gap-2.5"></ul>
              </div>

              <div data-docs-alert role="alert" class="hidden w-full items-start gap-3 rounded-md bg-[#fef2f2] p-4">
                <img src="../../assets/onboarding/icon-exclamation-circle-red.svg" alt="" width="20" height="20" class="size-5 shrink-0">
                <div class="flex flex-1 flex-col gap-2 text-sm leading-5">
                  <p class="font-medium text-[#991b1b]">Open and mark the following attachments as Done to continue:</p>
                  <ul data-docs-missing class="text-[#b91c1c]"></ul>
                </div>
              </div>
            </div>
          </div>

          <!-- Actions: Back (desktop only) + Next -->
          <div class="mt-auto flex px-4 pb-6 lg:px-14 lg:pb-14">
            <div class="flex w-full gap-8">
              <a href="confirm-business-details.html"
                class="hidden flex-1 items-center justify-center rounded-[10px] border border-gray-300 bg-white px-[25px] py-4 text-base leading-6 font-medium text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 lg:flex">Back</a>
              <button type="button" data-docs-next
                class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-[10px] bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] py-4 pr-[23px] pl-[25px] text-base leading-6 font-medium text-white shadow-xs hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:brightness-100">
                Next
                <img src="../../assets/onboarding/icon-arrow-narrow-right.svg" alt="" width="20" height="20" class="size-5">
              </button>
            </div>
          </div>
        </div>

        <!-- Footer: on desktop the sidebar carries it -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>

  </div>
</body>
</html>
