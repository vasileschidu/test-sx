    <div class="flex w-full max-w-[512px] flex-col gap-8 bg-white md:rounded-lg md:p-8 dark:bg-gray-900">

      <div class="flex w-full flex-col gap-4">
        <div class="flex size-12 items-center justify-center rounded-full bg-red-50 dark:bg-red-500/10">
          <img src="../../assets/onboarding/icon-x-circle-red.svg" alt="" width="24" height="24" class="size-6">

        <h1 class="text-2xl leading-8 font-semibold text-gray-900 dark:text-white">Your SMART Disburse access has been revoked</h1>

        <div data-client-contact class="flex w-full rounded-lg border border-gray-200 p-4 dark:border-white/10"></div>
