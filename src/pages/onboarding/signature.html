<!--
  @file onboarding/signature.html
  @description Step 4 of onboarding. User provides a signature via freehand
    drawing on a canvas or by typing their name in a cursive font.
-->
<!doctype html>
<html class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/signature.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var KEY = 'sd-onboarding-state';

      function getState() {
        try { return JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
      }
      function saveState(patch) {
        var s = getState();
        Object.assign(s, patch);
        sessionStorage.setItem(KEY, JSON.stringify(s));
      }

      // Restore after signature.js has initialized
      setTimeout(function () {
        var saved = getState();
        var canvas = document.getElementById('signature-canvas');
        var tabType = document.getElementById('tab-type');
        var fullName = document.getElementById('fullName');
        var nextBtn = document.getElementById('next-button');

        if (saved.signatureMode === 'type' && saved.signatureName) {
          if (tabType) tabType.click();
          if (fullName) {
            fullName.value = saved.signatureName;
            fullName.dispatchEvent(new Event('input'));
          }
        } else if (saved.signatureDataUrl && canvas) {
          var img = new Image();
          img.onload = function () {
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.getBoundingClientRect().width, canvas.getBoundingClientRect().height);
            if (nextBtn) nextBtn.disabled = false;
          };
          img.src = saved.signatureDataUrl;
        }
      }, 0);

      // Save mode and typed name on changes
      var tabDraw = document.getElementById('tab-draw');
      var tabType = document.getElementById('tab-type');
      var fullName = document.getElementById('fullName');
      var canvas = document.getElementById('signature-canvas');

      if (tabDraw) tabDraw.addEventListener('click', function () {
        saveState({ signatureMode: 'draw', signatureDataUrl: null, signatureName: '' });
      });
      if (tabType) tabType.addEventListener('click', function () {
        saveState({ signatureMode: 'type', signatureDataUrl: null });
      });
      if (fullName) fullName.addEventListener('input', function () {
        saveState({ signatureMode: 'type', signatureName: fullName.value });
      });

      // Save canvas drawing on pointer up
      if (canvas) canvas.addEventListener('pointerup', function () {
        setTimeout(function () {
          saveState({ signatureMode: 'draw', signatureDataUrl: canvas.toDataURL() });
        }, 0);
      });
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Meow+Script&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto max-w-[1024px] w-full min-h-screen bg-white flex flex-col lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN -->
    <div class="flex-1 flex flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <!-- Content area -->
        <div data-ob-content class="flex-1 flex flex-col items-center px-4 pt-10 pb-8 lg:px-10 lg:pt-12">
          <div class="w-full max-w-[640px]">
            <h1 class="text-3xl font-semibold text-gray-900">Sign for Payment</h1>


            <!-- Canvas -->
            <div class="mt-6 hidden sm:block">
              <nav aria-label="Tabs" class="flex space-x-4">
                <button id="tab-draw" type="button" aria-current="page"
                  class="rounded-md bg-gray-100 px-3 py-2 text-sm font-medium text-gray-900">
                  Draw
                </button>
                <button id="tab-type" type="button"
                  class="rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">
                  Type
                </button>
              </nav>
            </div>

            <!-- TYPE input (hidden by default). 24px gap to box = mt-6 -->
            <div id="type-input-wrap" class="mt-6 hidden">
              <div>
                <label for="fullName" class="block text-sm/6 font-medium text-gray-900 dark:text-white">Your Full
                  Name</label>
                <div class="mt-2">
                  <input id="fullName" type="text" name="fullName" placeholder="Type your full name"
                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                </div>
              </div>
            </div>

            <!-- Signature area -->
            <div
              class="relative mt-6 flex h-[296px] w-full flex-col items-center gap-4 self-stretch rounded-2xl border border-gray-200 bg-gray-50 p-4">

              <canvas id="signature-canvas" class="h-full w-full rounded-lg"></canvas>

              <button id="clear-signature" type="button"
                class="absolute top-4 right-4 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
                Clear
              </button>

            </div>


          </div>

          <div class="w-full max-w-[640px] mt-auto pt-10 pb-6">

            <div class="mt-6 flex items-center gap-6">


              <button id="next-button" type="button" disabled
                class="inline-flex h-11 flex-1 items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">
                Sign & Go next

              </button>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>
  </div>


</body>

</html>
