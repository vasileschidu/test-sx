<!--
  @file onboarding/confirm-identity.html
  @description Step 1 "Verification Step" (Figma "1. Verification Step",
    node 19447:65397). The payee agrees to receive a one-time code by email (or
    phone with ?channel=phone), requests it, and submits it within its validity
    window. Logic: src/scripts/confirm-identity.js; settings:
    src/data/sd-verification.json. Too many failed attempts lead to revoked.html.
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Step · SMART Disburse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script src="../../../src/scripts/onboarding-sidebar.js"></script>
  <script src="../../../src/scripts/onboarding-field.js"></script>
  <script src="../../../src/scripts/onboarding-modal.js"></script>
  <script src="../../../src/scripts/onboarding-decline.js"></script>
  <script src="../../../src/scripts/onboarding-stepper.js"></script>
  <script src="../../../src/scripts/onboarding-mobile-header.js"></script>
  <script src="../../../src/scripts/confirm-identity.js"></script>
</head>

<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">

  <!-- CONTAINER -->
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">

    <!-- LEFT SIDEBAR: rendered by onboarding-sidebar.js -->
    <div data-ob-sidebar></div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <form id="verify-form" novalidate data-ob-content class="flex flex-1 flex-col gap-14">

          <div class="flex flex-col gap-6 px-4 pt-10 lg:gap-9 lg:px-14 lg:pt-14">
            <!-- Title + intro -->
            <div class="flex w-full max-w-[460px] flex-col gap-4">
              <div class="flex flex-col gap-2.5">
                <img data-verify-icon src="../../assets/onboarding/icon-envelope-solid.svg" alt="" width="24" height="24" class="size-6">
                <h1 data-verify-title class="text-3xl leading-9 font-semibold text-[#1f2937]">Verification Step</h1>
              </div>
              <div class="flex flex-col gap-2.5 text-sm leading-5 text-gray-500">
                <p data-verify-intro>
                  For your security we need to authenticate you. We'll send a verification code to the
                  <span data-verify-channel-label>email address</span>
                  <span data-ob-skeleton data-verify-contact class="font-semibold text-gray-900">rach****@mail.com</span><span class="text-gray-900">.</span>
                </p>
                <p data-verify-ready>Select <span class="font-semibold text-gray-900">Request Code</span> when ready.</p>
              </div>
            </div>

            <!-- Code entry (after a code has been requested) -->
            <div data-verify-field class="hidden w-full max-w-[460px] flex-col gap-4">
              <div class="flex flex-col gap-1">
                <label for="verify-code" class="text-sm leading-5 font-medium text-[#374151]">Please enter the code below.</label>
                <div class="relative">
                  <input id="verify-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"
                    aria-describedby="verify-error verify-timer-line"
                    data-ob-input>
                  <img data-verify-error-icon src="../../assets/onboarding/icon-exclamation-circle-error.svg" alt="" width="20" height="20" class="pointer-events-none absolute top-1/2 right-3 hidden size-5 -translate-y-1/2">
                </div>
                <p id="verify-error" data-verify-error role="alert" class="hidden text-sm leading-5 text-[#dc2626]"></p>
              </div>
              <p id="verify-timer-line" data-verify-timer-line class="text-sm leading-5 text-gray-500">
                Code is valid for <span data-verify-timer class="font-semibold text-gray-900">02:00</span><span class="font-medium text-gray-900">.</span>
              </p>
              <p data-verify-expired role="alert" class="hidden text-sm leading-5 text-[#dc2626]">
                <span class="font-semibold">Code expired</span>. You have <span data-verify-remaining>2</span> out of <span data-verify-max>3</span> attempts remaining. Please select <span class="font-semibold">Request Code</span> when ready.
              </p>
            </div>
          </div>

          <!-- Consent + actions -->
          <div class="mt-auto flex flex-col gap-8 px-4 pb-6 lg:px-14 lg:pb-14">
            <label data-verify-consent class="flex cursor-pointer items-start gap-3">
              <!-- SMART System "Checkbox + Text": 16px box, #2563EB with a white check when ticked -->
              <span class="relative mt-0.5 flex size-4 shrink-0">
                <input type="checkbox" data-verify-consent-input
                  class="peer size-4 cursor-pointer appearance-none rounded border border-gray-300 bg-white not-checked:hover:border-gray-400 checked:border-[#2563eb] checked:bg-[#2563eb] checked:hover:border-[#1d4ed8] checked:hover:bg-[#1d4ed8] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563eb] disabled:cursor-not-allowed disabled:border-gray-200 disabled:bg-gray-100">
                <img src="../../assets/onboarding/icon-checkbox-check.svg" alt="" width="12" height="12"
                  class="pointer-events-none absolute top-1/2 left-1/2 hidden size-3 -translate-x-1/2 -translate-y-1/2 peer-checked:block">
              </span>
              <span class="text-sm leading-5 text-gray-500">I agree to receive verification codes from Transcard.</span>
            </label>
            <div class="flex flex-col-reverse gap-4 lg:flex-row lg:gap-8">
              <button type="button" data-verify-request disabled
                class="flex flex-1 cursor-pointer items-center justify-center rounded-[10px] border border-gray-300 bg-white px-[25px] py-4 text-base leading-6 font-medium text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-[#ebebeb] disabled:text-gray-500 disabled:opacity-40 disabled:hover:bg-[#ebebeb]">Request Code</button>
              <button type="submit" data-verify-submit disabled
                class="flex flex-1 cursor-pointer items-center justify-center rounded-[10px] bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] px-[25px] py-4 text-base leading-6 font-medium text-white shadow-xs hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:brightness-100">Submit Code</button>
            </div>
          </div>
        </form>

        <!-- Footer: on desktop the sidebar carries it -->
        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>

  </div>
</body>
</html>
