  @description SMART Enroll sign in (TCDM-5242, T2): email → 6-digit code (everyone, D-7) or the Microsoft
    account picker (Microsoft-linked accounts only) → Choose a Business (2+ businesses only) → Select Platform
    (Approved business only, D-8) → otherwise the application (application.html). No real auth.
