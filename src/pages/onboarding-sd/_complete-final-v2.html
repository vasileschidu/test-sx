<!--
  @file onboarding-sd/complete.html
  @description Final step of SD onboarding. No sidebar — content centered.
-->
<!doctype html>
<html class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/onboarding-transitions.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var KEY = 'sd-onboarding-state';
      function getState() {
        try { return JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
      }

      var s = getState();
      var vc = s.virtualCard || {};
      var fullName = [vc.firstName, vc.lastName].filter(Boolean).join(' ') || 'James Rivera';

      var rcptName = document.getElementById('rcpt-name');
      if (rcptName) rcptName.textContent = fullName;

      var now = new Date();
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var dd = String(now.getDate()).padStart(2, '0');
      var hh = now.getHours();
      var ampm = hh >= 12 ? 'PM' : 'AM';
      var h12 = String(hh % 12 || 12).padStart(2, '0');
      var mm = String(now.getMinutes()).padStart(2, '0');
      var ss = String(now.getSeconds()).padStart(2, '0');
      var rcptDate = document.getElementById('rcpt-date');
      if (rcptDate) rcptDate.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + dd + ' ' + now.getFullYear() + ' ' + h12 + ':' + mm + ':' + ss + ' ' + ampm + ' (ET)';
    });
  </script>
</head>

<body class="min-h-screen bg-white antialiased font-['Inter'] flex flex-col px-0 lg:px-6">

  <main data-ob-content class="flex-1 flex flex-col items-center justify-center py-12 gap-6">

    <!-- Success header -->
    <div class="flex flex-col items-center text-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-11 text-green-500" aria-hidden="true">
        <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd" />
      </svg>
      <div class="flex flex-col items-center gap-1">
        <h1 class="text-lg font-semibold text-gray-900">Successfully Submitted!</h1>
        <p class="text-sm text-gray-500">Your virtual card was issued and funded.</p>
      </div>
    </div>

    <!-- Info card (Figma: bg-gray-50, border-gray-200) -->
    <div class="w-full max-w-[400px] overflow-hidden rounded-md border border-gray-200 bg-gray-50">

      <!-- Amount -->
      <div class="p-4">
        <p class="text-sm font-semibold text-gray-600">Amount</p>
        <p class="mt-1.5 text-3xl font-bold tracking-tight text-gray-900">$3,526.00</p>
      </div>

      <!-- Mini card + Reveal Card Details -->
      <div class="flex items-center gap-2 px-4 pb-4">
        <!-- Mini card thumbnail (exact same component as success modal) -->
        <div class="flex h-[46px] w-[71px] flex-col items-end gap-0.5 rounded-md bg-gray-950 p-2 text-gray-200 font-['Roboto_Mono'] text-[10px] leading-3">
          <svg width="32" height="14" viewBox="0 0 52 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M32.8867 28.5803H18.8867V3.42188H32.8867V28.5803Z" fill="#F14D1C"/>
            <path d="M19.7765 16C19.7745 18.4228 20.3233 20.8143 21.3829 22.9941C22.4416 25.1734 23.9824 27.0836 25.8876 28.5796C23.5272 30.4349 20.6927 31.5884 17.7079 31.9089C14.723 32.2287 11.7073 31.7027 9.00732 30.3913C6.30731 29.0782 4.03059 27.0338 2.43807 24.488C0.844559 21.9437 0 19.0025 0 16C0 12.998 0.844559 10.0557 2.43807 7.51144C4.03059 4.96671 6.30731 2.92113 9.00732 1.60928C11.7073 0.296621 14.723 -0.229337 17.7079 0.091656C20.6927 0.412151 23.5272 1.56526 25.8876 3.421C23.9824 4.91691 22.4416 6.82593 21.3829 9.00606C20.3243 11.1851 19.7745 13.5765 19.7765 16Z" fill="#EB1C24"/>
            <path d="M51.7733 16C51.7733 12.998 50.9287 10.0557 49.3362 7.51144C47.7427 4.96671 45.467 2.92113 42.766 1.60928C40.066 0.296621 37.0512 -0.229337 34.0664 0.091656C31.0816 0.412151 28.2461 1.56526 25.8867 3.421C27.791 4.91771 29.3297 6.82783 30.3884 9.00725C31.4471 11.1863 31.9968 13.5777 31.9968 16C31.9968 18.4228 31.4471 20.8131 30.3884 22.9921C29.3297 25.1715 27.791 27.0818 25.8867 28.5796C28.2461 30.4349 31.0816 31.5884 34.0664 31.9089C37.0512 32.2287 40.066 31.7027 42.766 30.3913C45.467 29.0782 47.7427 27.0338 49.3362 24.488C50.9287 21.9437 51.7733 19.0025 51.7733 16Z" fill="#F59412"/>
          </svg>
          <div class="mt-auto whitespace-nowrap">•••• 6078</div>
        </div>
        <!-- Reveal Card Details button (exact same as success modals) -->
        <button type="button" class="inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-sm font-semibold text-gray-600 hover:bg-gray-200 hover:text-gray-900">
          Reveal Card Details
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4" aria-hidden="true">
            <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
            <path fill-rule="evenodd" d="M.664 10.59a1.651 1.651 0 0 1 0-1.186A10.004 10.004 0 0 1 10 3c4.257 0 7.893 2.66 9.336 6.41.147.381.146.804 0 1.186A10.004 10.004 0 0 1 10 17c-4.257 0-7.893-2.66-9.336-6.41ZM14 10a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      <!-- Separator -->
      <div class="border-t border-gray-200"></div>

      <!-- Detail rows -->
      <dl class="p-4">
        <div class="px-2 py-2 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
          <dt class="text-sm/6 font-medium text-gray-900">Full Name</dt>
          <dd data-ob-skeleton id="rcpt-name" class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">—</dd>
        </div>
        <div class="px-2 py-2 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
          <dt class="text-sm/6 font-medium text-gray-900">Receipt Date</dt>
          <dd data-ob-skeleton id="rcpt-date" class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">—</dd>
        </div>
        <div class="px-2 py-2 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
          <dt class="text-sm/6 font-medium text-gray-900">Transaction ID</dt>
          <dd class="mt-1 text-sm/6 text-gray-700 sm:col-span-2 sm:mt-0">233DFERDRGRG54EV45GT</dd>
        </div>
        <div class="px-2 py-2 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
          <dt class="text-sm/6 font-medium text-gray-900">Client Payment Reference ID</dt>
          <dd class="mt-1 text-sm/6 text-gray-500 sm:col-span-2 sm:mt-0">[ClientPaymentReferenceId]</dd>
        </div>
        <div class="px-2 py-2 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-0">
          <dd class="text-sm/6 font-medium text-gray-500 sm:col-span-2">[ClientName]</dd>
        </div>
      </dl>

      <!-- Separator -->
      <div class="border-t border-gray-200"></div>

      <!-- Download Details -->
      <div class="p-4">
        <button type="button" class="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-600 hover:text-blue-700 transition-colors">
          Download Details
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4" aria-hidden="true">
            <path d="M10.75 2.75a.75.75 0 0 0-1.5 0v8.614L6.295 8.235a.75.75 0 1 0-1.09 1.03l4.25 4.5a.75.75 0 0 0 1.09 0l4.25-4.5a.75.75 0 0 0-1.09-1.03l-2.955 3.129V2.75Z" />
            <path d="M3.5 12.75a.75.75 0 0 0-1.5 0v2.5A2.75 2.75 0 0 0 4.75 18h10.5A2.75 2.75 0 0 0 18 15.25v-2.5a.75.75 0 0 0-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5Z" />
          </svg>
        </button>
      </div>

    </div>

    <!-- Trademark Disclaimer -->
    <button type="button" class="inline-flex items-center gap-1.5 rounded-md bg-gray-100 px-2.5 py-1.5 text-sm font-semibold text-gray-600 shadow-xs hover:bg-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-4 shrink-0" aria-hidden="true">
        <path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-7-4a1 1 0 1 1-2 0 1 1 0 0 1 2 0ZM9 9a.75.75 0 0 0 0 1.5h.253a.25.25 0 0 1 .244.304l-.459 2.066A1.75 1.75 0 0 0 10.747 15H11a.75.75 0 0 0 0-1.5h-.253a.25.25 0 0 1-.244-.304l.459-2.066A1.75 1.75 0 0 0 9.253 9H9Z" clip-rule="evenodd" />
      </svg>
      Trademark Disclaimer
    </button>

  </main>

  <!-- Footer -->
  <footer class="flex items-center justify-center gap-1.5 py-5 px-6">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M8.91309 1.125C11.4548 3.2985 15.5771 3.43066 15.5771 3.43066V9.22656C15.5767 12.7831 8.91309 16.875 8.91309 16.875C8.86421 16.8449 2.25042 12.77 2.25 9.22656V3.43066C2.25 3.43066 6.37134 3.29832 8.91309 1.125ZM7.2793 9.90918C7.2091 9.94947 7.16702 10.0229 7.16699 10.1035V12.5801C7.16699 12.6002 7.17163 12.6209 7.18164 12.6377C7.21173 12.6914 7.28048 12.708 7.33398 12.6777L11.2783 10.3828C11.3134 10.3627 11.3352 10.3254 11.3369 10.2852V7.54785L7.2793 9.90918ZM7.33398 5.21191C7.28052 5.18171 7.21343 5.19831 7.18164 5.25195C7.17161 5.26875 7.16699 5.28942 7.16699 5.30957V7.78613C7.16699 7.86667 7.2082 7.94112 7.27832 7.98145L8.46582 8.6709L10.8701 7.27051L7.33398 5.21191Z" fill="#0089CF"/>
    </svg>
    <span class="text-xs text-gray-700">
      Powered by <span class="font-bold">Transcard</span>
      <span class="mx-1">|</span>
      <a href="#" class="text-gray-700 hover:underline">Terms of Use</a>
      <span class="mx-0.5">&bull;</span>
      <a href="#" class="text-gray-700 hover:underline">Privacy Policy</a>
      <span class="mx-0.5">&bull;</span>
      <a href="#" class="text-gray-700 hover:underline">E-Sign Consent</a>
    </span>
  </footer>

</body>
</html>
