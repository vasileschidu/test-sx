<!--
  @file onboarding/confirm-identity.html
  @description Step 1 of onboarding. User confirms identity by entering their
    invoice number and vendor ID. Inputs are auto-uppercased.
-->
<!doctype html>
<html class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="../../../src/scripts/sd-onboarding-context.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var invoiceInput = document.getElementById('invoice-number');
      var vendorInput = document.getElementById('vendor-id');
      var nextButton = document.getElementById('next-button');
      var introLine = document.getElementById('identity-intro-line');
      var identityError = document.getElementById('identity-error');
      var invoiceIcon = document.getElementById('invoice-error-icon');
      var vendorIcon = document.getElementById('vendor-error-icon');
      var MAX_ATTEMPTS = 3;

      function getState() {
        return window.SDOnboardingContext ? window.SDOnboardingContext.getState() : {};
      }
      function saveState(patch) {
        return window.SDOnboardingContext ? window.SDOnboardingContext.saveState(patch) : getState();
      }
      function formatMoney(amount, currency) {
        var numeric = Number(amount || 0);
        if (!Number.isFinite(numeric)) numeric = 0;
        try {
          return new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || 'USD' }).format(numeric);
        } catch (error) {
          return '$' + numeric.toFixed(2);
        }
      }
      function applyErrorState(active) {
        [invoiceInput, vendorInput].forEach(function (input) {
          input.setAttribute('aria-invalid', active ? 'true' : 'false');
          input.classList.toggle('text-red-900', active);
          input.classList.toggle('outline-red-300', active);
          input.classList.toggle('placeholder:text-red-300', active);
          input.classList.toggle('focus:outline-red-600', active);
          input.classList.toggle('text-gray-900', !active);
          input.classList.toggle('outline-gray-300', !active);
          input.classList.toggle('placeholder:text-gray-400', !active);
          input.classList.toggle('focus:outline-blue-600', !active);
        });
        if (invoiceIcon) invoiceIcon.classList.toggle('hidden', !active);
        if (vendorIcon) vendorIcon.classList.toggle('hidden', !active);
      }
      function updateNextState() {
        nextButton.disabled = invoiceInput.value.trim() === '' || vendorInput.value.trim() === '';
      }

      Promise.resolve(window.SDOnboardingContext && window.SDOnboardingContext.bootstrap ? window.SDOnboardingContext.bootstrap() : null)
        .then(function () {
          var saved = getState();
          var context = saved.payableContext || {};
          var expectedInvoice = String((context.billNumber || '')).trim().toUpperCase();
          var expectedVendorId = String((context.vendorId || '')).trim().toUpperCase();
          var attemptsUsed = Number(saved.identityAttemptsUsed || 0);

          if (introLine && context.amount) {
            introLine.textContent = formatMoney(context.amount, context.currency) + ' from ' + String(context.senderName || 'SMART Hub') + ' is ready to collect.';
          }
          if (expectedInvoice) invoiceInput.placeholder = expectedInvoice;
          if (expectedVendorId) vendorInput.placeholder = expectedVendorId;
          if (saved.invoiceNumber) invoiceInput.value = String(saved.invoiceNumber || '').toUpperCase();
          if (saved.vendorId) vendorInput.value = String(saved.vendorId || '').toUpperCase();

          function clearErrorState() {
            applyErrorState(false);
            if (identityError) {
              identityError.classList.add('hidden');
              identityError.textContent = '';
            }
          }

          invoiceInput.addEventListener('input', function () {
            invoiceInput.value = invoiceInput.value.toUpperCase();
            saveState({ invoiceNumber: invoiceInput.value, identityValidated: false });
            clearErrorState();
            updateNextState();
          });

          vendorInput.addEventListener('input', function () {
            vendorInput.value = vendorInput.value.toUpperCase();
            saveState({ vendorId: vendorInput.value, identityValidated: false });
            clearErrorState();
            updateNextState();
          });

          nextButton.addEventListener('click', function () {
            if (nextButton.disabled) return;
            var invoiceValue = invoiceInput.value.trim().toUpperCase();
            var vendorValue = vendorInput.value.trim().toUpperCase();
            var matches = invoiceValue && vendorValue && invoiceValue === expectedInvoice && vendorValue === expectedVendorId;
            if (matches) {
              saveState({ invoiceNumber: invoiceValue, vendorId: vendorValue, identityValidated: true, identityAttemptsUsed: attemptsUsed });
              window.location.href = 'review-documents.html';
              return;
            }

            attemptsUsed = Math.min(MAX_ATTEMPTS, attemptsUsed + 1);
            saveState({ invoiceNumber: invoiceValue, vendorId: vendorValue, identityValidated: false, identityAttemptsUsed: attemptsUsed });
            applyErrorState(true);
            if (identityError) {
              var remaining = Math.max(0, MAX_ATTEMPTS - attemptsUsed);
              identityError.textContent = remaining > 0
                ? (remaining + ' out of ' + MAX_ATTEMPTS + ' attempts remain. Re-enter your invoice number and Payee ID to continue.')
                : 'No attempts remain. Request a new payment link and try again.';
              identityError.classList.remove('hidden');
            }
          });

          updateNextState();
        });
    });
  </script>
</head>

<body class="min-h-screen bg-gray-200 px-6 antialiased font-['Inter']">

  <!-- CONTAINER -->
  <div class="mx-auto max-w-[1024px] w-full h-screen bg-white flex flex-row overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <div class="bg-gradient-to-b from-[#1E326F] to-[#090C38] w-[325px] shrink-0 self-stretch flex flex-col p-[56px] gap-[35px]">

      <!-- Logo -->
      <button class="ml-auto flex items-center gap-2 p-2.5 rounded-lg bg-gray-900/25 hover:bg-gray-900/35">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M18.6709 15.8289L15.1834 13.8033L8.12004 17.9137L18.5088 23.9562C18.666 24.0449 18.8625 23.9956 18.9558 23.8379C18.9853 23.7886 19 23.7295 19 23.6703L19 16.4007C19 16.1641 18.8772 15.9472 18.6709 15.8289Z" fill="white"/>
          <path d="M18.6709 10.171C18.8772 10.0527 19 9.83584 19 9.59926L19 2.32958C19 2.27044 18.9853 2.2113 18.9558 2.16201C18.8674 2.0043 18.666 1.95501 18.5088 2.04372L6.92153 8.78112C6.81838 8.84026 6.75453 8.94869 6.74961 9.06697L6.74961 17.1006L18.6709 10.171Z" fill="white"/>
        </svg>
      </button>

      <!-- Stepper Nav -->
      <nav aria-label="Progress">
        <ol role="list" class="space-y-6">

          <!-- Current Step -->
          <li>
            <a href="#" aria-current="step" class="flex items-start">
              <span aria-hidden="true" class="relative flex size-5 shrink-0 items-center justify-center">
                <span class="absolute size-4 rounded-full bg-white/20"></span>
                <span class="relative block size-2 rounded-full bg-white"></span>
              </span>
              <span class="ml-3 text-sm font-medium text-white">Confirm Identity</span>
            </a>
          </li>

          <!-- Upcoming Steps -->
          <li>
            <a href="review-documents.html" class="group">
              <div class="flex items-start">
                <div aria-hidden="true" class="relative flex size-5 shrink-0 items-center justify-center">
                  <div class="size-2 rounded-full bg-white/15 group-hover:bg-white/25"></div>
                </div>
                <p class="ml-3 text-sm font-medium text-white/30 group-hover:text-white">Review Documents</p>
              </div>
            </a>
          </li>

          <li>
            <a href="signature.html" class="group">
              <div class="flex items-start">
                <div aria-hidden="true" class="relative flex size-5 shrink-0 items-center justify-center">
                  <div class="size-2 rounded-full bg-white/15 group-hover:bg-white/25"></div>
                </div>
                <p class="ml-3 text-sm font-medium text-white/30 group-hover:text-white">Provide Signature</p>
              </div>
            </a>
          </li>

          <li>
            <a href="paywall.html" class="group">
              <div class="flex items-start">
                <div aria-hidden="true" class="relative flex size-5 shrink-0 items-center justify-center">
                  <div class="size-2 rounded-full bg-white/15 group-hover:bg-white/25"></div>
                </div>
                <p class="ml-3 text-sm font-medium text-white/30 group-hover:text-white">Method of Payment</p>
              </div>
            </a>
          </li>
          <li>
            <a href="summary.html" class="group">
              <div class="flex items-start">
                <div aria-hidden="true" class="relative flex size-5 shrink-0 items-center justify-center">
                  <div class="size-2 rounded-full bg-white/15 group-hover:bg-white/25"></div>
                </div>
                <p class="ml-3 text-sm font-medium text-white/30 group-hover:text-white">Summary</p>
              </div>
            </a>
          </li>


          <li>
            <a href="#" class="group">
              <div class="flex items-start">
                <div aria-hidden="true" class="relative flex size-5 shrink-0 items-center justify-center">
                  <div class="size-2 rounded-full bg-white/15 group-hover:bg-white/25"></div>
                </div>
                <p class="ml-3 text-sm font-medium text-white/30 group-hover:text-white">Complete</p>
              </div>
            </a>
          </li>

        </ol>
      </nav>
    </div>

    <!-- RIGHT COLUMN (scrolls) -->
    <div class="flex-1 flex flex-col min-h-0 overflow-y-auto">

      <!-- Inner wrapper: makes footer stick to bottom when content is short -->
      <div class="min-h-screen flex flex-col">

        <!-- Content area -->
        <div class="flex-1 flex flex-col items-center px-10 pt-12 pb-8">

         

          <!-- Page Title -->
          <div class="w-full max-w-[640px]">
            <h1 class="text-3xl font-semibold text-gray-900">Let's make sure it's you!</h1>
            <p class="mt-2 text-sm text-gray-500">To collect your payment, please confirm the following.</p>
            <p id="identity-intro-line" class="mt-1 text-sm text-gray-500"></p>

            <div class="mt-8 flex w-full flex-col gap-4">
              <div class="sm:max-w-[430px]">
                <label for="invoice-number" class="block text-sm/6 font-medium text-gray-900">Invoice Number</label>
                <div class="mt-2 grid grid-cols-1">
                  <input id="invoice-number" type="text" name="invoice-number" placeholder="INV-2026-10458" aria-invalid="false" aria-describedby="identity-error" class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pr-10 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                  <svg id="invoice-error-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-3 hidden size-5 self-center justify-self-end text-red-500 sm:size-4">
                    <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" fill-rule="evenodd" />
                  </svg>
                </div>
              </div>

              <div class="sm:max-w-[430px]">
                <label for="vendor-id" class="block text-sm/6 font-medium text-gray-900">Your Vendor ID</label>
                <div class="mt-2 grid grid-cols-1">
                  <input id="vendor-id" type="text" name="vendor-id" placeholder="PAYEE-123456" aria-invalid="false" aria-describedby="identity-error" class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pr-10 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
                  <svg id="vendor-error-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" class="pointer-events-none col-start-1 row-start-1 mr-3 hidden size-5 self-center justify-self-end text-red-500 sm:size-4">
                    <path d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" fill-rule="evenodd" />
                  </svg>
                </div>
              </div>

              <p id="identity-error" class="hidden max-w-[430px] rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700"></p>
            </div>

          </div>

          <!-- Actions row (pushes toward bottom when page is short) -->
          <div class="w-full max-w-[640px] mt-auto pt-10 pb-6">
            <div class="flex items-center gap-6">

              <button type="button" class="h-11 flex-1 rounded-md bg-white px-3.5 py-2.5 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">
                Back
              </button>

              <button id="next-button" type="button" disabled class="inline-flex h-11 flex-1 items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">
                Next
                <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true" class="-mr-0.5 size-5">
                  <path fill-rule="evenodd" d="M3 10a.75.75 0 0 1 .75-.75h10.19L10.22 5.53a.75.75 0 1 1 1.06-1.06l5 5a.75.75 0 0 1 0 1.06l-5 5a.75.75 0 1 1-1.06-1.06l3.72-3.72H3.75A.75.75 0 0 1 3 10Z" clip-rule="evenodd" />
                </svg>
              </button>

            </div>
          </div>

        </div>

        <!-- Footer -->
        <div class="flex items-center justify-center gap-1.5 py-5 px-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M8.91309 1.125C11.4548 3.2985 15.5771 3.43066 15.5771 3.43066V9.22656C15.5767 12.7831 8.91309 16.875 8.91309 16.875C8.86421 16.8449 2.25042 12.77 2.25 9.22656V3.43066C2.25 3.43066 6.37134 3.29832 8.91309 1.125ZM7.2793 9.90918C7.2091 9.94947 7.16702 10.0229 7.16699 10.1035V12.5801C7.16699 12.6002 7.17163 12.6209 7.18164 12.6377C7.21173 12.6914 7.28048 12.708 7.33398 12.6777L11.2783 10.3828C11.3134 10.3627 11.3352 10.3254 11.3369 10.2852V7.54785L7.2793 9.90918ZM7.33398 5.21191C7.28052 5.18171 7.21343 5.19831 7.18164 5.25195C7.17161 5.26875 7.16699 5.28942 7.16699 5.30957V7.78613C7.16699 7.86667 7.2082 7.94112 7.27832 7.98145L8.46582 8.6709L10.8701 7.27051L7.33398 5.21191Z" fill="#0089CF"/>
          </svg>
          <span class="text-xs text-gray-700">
            Powered by <span class="font-bold">Transcard</span>
            <span class="mx-1">|</span>
            <a href="#" class="text-gray-700 hover:underline">Terms of Use</a>
            <span class="mx-0.5">&bull;</span>
            <a href="#" class="text-gray-700 hover:underline">Privacy Policy</a>
            <span class="mx-0.5">&bull;</span>
            <a href="#" class="text-gray-700 hover:underline">E-Sign Consent</a>
          </span>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
