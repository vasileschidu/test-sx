<!doctype html>
<html class="h-full bg-gray-100 dark:bg-gray-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkbox States</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../../scripts/tailwind-theme.js"></script>
    <link rel="stylesheet" href="../../styles/checkbox.css" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>

    <script src="../../scripts/theme-init.js"></script>
    <script src="../../scripts/checkbox-component.js"></script>
    <script src="../../scripts/pages/checkbox-states-page.js" defer></script>

  <body

      <h1 class="text-3xl font-semibold text-gray-600 dark:text-gray-300">

      <p class="text-sm text-gray-500">
