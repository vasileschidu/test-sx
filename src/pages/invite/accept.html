<!--
  @file invite/accept.html
  @description The page an invitation email links to (User Management). No dashboard shell.
    ?inv=<base64url JSON> carries the invite, so it works on any device.
    Figma [REVIEW] User Management qiy6GvUHQMhdbC7hkXCCyb › "Create Account from Invitation"
    (271:111827): Initial Form → Enter Verification Code → Choose a Business → You are in SMART Hub.
    Other states: expired; revoked / unknown; already accepted; broken link.
    Same browser as the inviter: accepting turns the user Active in UMStore. Logic: um-accept.js.
-->

<html lang="en" class="h-full bg-gray-50 dark:bg-gray-950">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="../../scripts/theme-init.js?v=20261112ic"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));

    <script src="../../scripts/tailwind-theme.js"></script>
    <script src="../../scripts/design-tokens.js"></script>
    <link rel="stylesheet" href="../../styles/cursor.css" />
    <link rel="stylesheet" href="../../styles/checkbox.css" />
    <script src="../../scripts/checkbox-component.js"></script>
    <script src="../../scripts/data-source.js"></script>
    <script src="../../scripts/onboarding-field.js?v=20261106a" defer></script>

    <script src="../../scripts/um-accept.js?v=20261113fg5" defer></script>

  <body class="h-full font-['Inter'] antialiased">
    <div class="relative isolate flex min-h-full flex-col items-center justify-center overflow-hidden px-4 py-10 sm:py-16">
      <!-- Background cubes (Figma 271:113207 / 271:113222; the SVG carries its 6% opacity). -->
      <img src="../../assets/invite/bg-cubes.svg" alt="" aria-hidden="true" width="667" height="668" class="pointer-events-none absolute -bottom-12 -left-24 -z-10 hidden w-167 sm:block dark:opacity-15" />
      <img src="../../assets/invite/bg-cubes.svg" alt="" aria-hidden="true" width="667" height="668" class="pointer-events-none absolute -top-14 -right-40 -z-10 hidden w-167 sm:block dark:opacity-15" />

      <div class="flex w-full max-w-117 flex-col items-center gap-6">
        <section

          aria-live="polite"
          aria-busy="true"
          class="w-full overflow-hidden rounded-3xl bg-white shadow-lg ring-1 ring-black/5 dark:bg-gray-900 dark:shadow-none dark:ring-white/10"
        >
          <div class="flex animate-pulse flex-col items-center gap-4 p-8" aria-hidden="true">
            <div class="size-18 rounded-2xl bg-gray-200 dark:bg-white/15"></div>
            <div class="h-6 w-2/3 rounded bg-gray-200 dark:bg-white/15"></div>
            <div class="h-16 w-full rounded-lg bg-gray-100 dark:bg-white/10"></div>
          </div>

        <!-- Footer/Powered by Transcard (same markup as the sidebar footer). -->
        <div class="flex flex-col items-center gap-2 py-4">

            <a href="https://smart-enroll.com/terms-of-use/EN" target="_blank" rel="noopener noreferrer" class="rounded-sm transition-colors hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:hover:text-white">Terms of Use<span class="sr-only"> (opens in a new tab)</span></a>
