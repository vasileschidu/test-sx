<!--
  @file wiki/index.html
  @description SMART Suite Wiki viewer. Renders the Markdown in /wiki (the
    source of truth, also read directly by agents) with navigation from
    wiki/manifest.json, search, page outline and Mermaid diagrams.
    Routes are hash based: index.html#/products/smart-hub/standard.md
-->
<!doctype html>
<html lang="en" class="h-full bg-gray-100 dark:bg-gray-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMART Suite Wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="../../../src/scripts/theme-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../../scripts/tailwind-theme.js"></script>
    <script src="../../../src/scripts/design-tokens.js"></script>
    <link rel="stylesheet" href="../../../src/styles/cursor.css" />
    <link rel="stylesheet" href="../../../src/styles/wiki.css" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      @custom-variant hover (&:hover);
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js" defer></script>
    <script src="../../../src/scripts/wiki-viewer.js" defer></script>
  </head>
  <body class="h-full font-[Inter] text-gray-900 antialiased dark:text-gray-100">
    <header
      class="sticky top-0 z-30 border-b border-gray-200 bg-white/95 backdrop-blur dark:border-white/10 dark:bg-gray-900/95"
    >
      <div class="mx-auto flex h-14 max-w-[1440px] items-center gap-2 px-4 sm:gap-3 sm:px-6">
        <button
          type="button"
          id="wiki-nav-toggle"
          class="-ml-1 rounded-md p-1.5 text-gray-600 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-600 lg:hidden dark:text-gray-300 dark:hover:bg-white/10"
          aria-controls="wiki-sidebar"
          aria-expanded="false"
        >
          <span class="sr-only">Toggle navigation</span>
          <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
        <a href="#/README.md" class="flex items-center gap-2 font-semibold whitespace-nowrap focus-visible:outline-2 focus-visible:outline-blue-600">
          <svg class="size-5 text-blue-600 dark:text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
          </svg>
          <span class="sm:hidden">Wiki</span><span class="hidden sm:inline">SMART Suite Wiki</span>
        </a>
        <div class="relative ml-auto min-w-0 flex-1 sm:max-w-xs">
          <label for="wiki-search" class="sr-only">Search the wiki</label>
          <svg class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" />
          </svg>
          <input
            id="wiki-search"
            type="search"
            autocomplete="off"
            placeholder="Search the wiki"
            class="block h-9 w-full rounded-md border border-gray-300 bg-white pr-3 pl-9 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:border-white/15 dark:bg-white/5 dark:text-white dark:placeholder:text-gray-500"
          />
        </div>
        <button
          type="button"
          id="wiki-theme-toggle"
          class="rounded-md p-1.5 text-gray-600 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-gray-300 dark:hover:bg-white/10"
          aria-pressed="false"
        >
          <span class="sr-only">Toggle dark mode</span>
          <svg data-theme-icon="light" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
          <svg data-theme-icon="dark" class="hidden size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        </button>
        <a
          href="../../../index.html"
          class="hidden text-sm font-medium whitespace-nowrap text-gray-600 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-blue-600 sm:block dark:text-gray-300 dark:hover:text-white"
          >All prototypes</a
        >
      </div>
    </header>

    <div class="mx-auto flex max-w-[1440px]">
      <nav
        id="wiki-sidebar"
        aria-label="Wiki"
        class="fixed inset-x-0 top-14 bottom-0 z-20 hidden overflow-y-auto border-r border-gray-200 bg-white px-4 py-6 lg:sticky lg:block lg:h-[calc(100vh-3.5rem)] lg:w-72 lg:shrink-0 dark:border-white/10 dark:bg-gray-900"
      >
        <div id="wiki-nav" class="text-sm"></div>
        <div id="wiki-search-results" class="hidden text-sm" aria-live="polite"></div>
      </nav>

      <main id="wiki-main" class="min-w-0 flex-1 px-4 py-8 sm:px-8 lg:px-12">
        <div class="mx-auto flex max-w-5xl gap-10">
          <article class="min-w-0 flex-1">
            <div id="wiki-meta"></div>
            <div id="wiki-content" class="wiki-prose" tabindex="-1">
              <p class="text-gray-500 dark:text-gray-400">Loading…</p>
            </div>
          </article>
          <aside class="hidden w-52 shrink-0 xl:block" aria-label="On this page">
            <div id="wiki-toc" class="sticky top-24 text-sm"></div>
          </aside>
        </div>
      </main>
    </div>
  </body>
</html>
