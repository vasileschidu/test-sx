<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
</head>
<!-- SMART Disburse UK · 5. Provide signature — draw or type -->
<body data-uk-step="3" data-uk-back="review.html" class="min-h-screen bg-[#1e326f] font-['Inter'] antialiased">
  <div class="flex min-h-screen w-full flex-col bg-[#1e326f]">
    <div data-uk-header></div>
    <main class="flex flex-1 flex-col rounded-t-[24px] bg-white px-4 pt-9 sm:px-6 lg:rounded-t-[32px] lg:pt-12">
      <div class="mx-auto flex w-full max-w-[640px] flex-1 flex-col gap-6">
      <h1 class="text-3xl font-semibold leading-9 text-gray-900">Sign insurance claim</h1>
      <div class="flex gap-2" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-sign-tab="draw" class="cursor-pointer rounded-md px-3 py-2 text-sm leading-5 font-medium text-gray-900 aria-selected:bg-gray-100">Draw</button>
        <button type="button" role="tab" aria-selected="false" data-sign-tab="type" class="cursor-pointer rounded-md px-3 py-2 text-sm leading-5 font-medium text-gray-900 aria-selected:bg-gray-100">Type</button>
      </div>
      <div class="hidden flex-col gap-2" data-sign-type-field>
        <label for="sign-name" class="text-sm leading-5 text-gray-900">Your Full Name</label>
        <input id="sign-name" data-uk-value="fullName" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
      </div>
      <div class="relative h-[290px] w-full overflow-hidden rounded-2xl bg-gray-50">
        <canvas id="sign-pad" class="uk-pad absolute inset-0 size-full cursor-crosshair"></canvas>
        <p class="uk-script pointer-events-none absolute inset-0 hidden items-center justify-center px-6 text-center text-[40px] text-gray-900" data-sign-preview></p>
        <p class="pointer-events-none absolute inset-0 flex items-center justify-center text-sm text-gray-400" data-sign-hint>Sign here with your finger or mouse</p>
        <button type="button" id="sign-clear" class="absolute top-4 right-4 cursor-pointer rounded-md bg-white px-2.5 py-1.5 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">Clear</button>
      </div>
      <div class="flex flex-1 flex-col justify-end gap-6">
        <button type="button" id="sign-submit" disabled class="uk-grad flex h-14 w-full items-center justify-center gap-2 rounded-lg px-3.5 text-base font-semibold text-white shadow-[0_16px_24px_0_rgba(55,115,255,0.16)] transition-opacity opacity-40 cursor-not-allowed">Sign</button>
        <div data-uk-footer></div>
      </div>
      </div>
    </main>
  </div>
  <script>
    SDUK.ready(function () {
      var pad = document.getElementById('sign-pad');
      var ctx = pad.getContext('2d');
      var submit = document.getElementById('sign-submit');
      var nameInput = document.getElementById('sign-name');
      var preview = document.querySelector('[data-sign-preview]');
      var hint = document.querySelector('[data-sign-hint]');
      var mode = 'draw', drawn = false, drawing = false;

      function size() {
        var r = window.devicePixelRatio || 1, b = pad.getBoundingClientRect();
        pad.width = b.width * r; pad.height = b.height * r;
        ctx.setTransform(r, 0, 0, r, 0, 0);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.2; ctx.strokeStyle = '#111827';
      }
      size();
      window.addEventListener('resize', function () { if (!drawn) size(); });

      function sync() {
        var ok = mode === 'draw' ? drawn : nameInput.value.trim().length > 1;
        SDUK.setEnabled(submit, ok);
        hint.classList.toggle('hidden', mode !== 'draw' || drawn);
        preview.textContent = nameInput.value;
      }
      function pt(e) { var b = pad.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
      pad.addEventListener('pointerdown', function (e) { if (mode !== 'draw') return; drawing = true; pad.setPointerCapture(e.pointerId); var p = pt(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      pad.addEventListener('pointermove', function (e) { if (!drawing) return; var p = pt(e); ctx.lineTo(p.x, p.y); ctx.stroke(); if (!drawn) { drawn = true; sync(); } });
      ['pointerup', 'pointercancel'].forEach(function (t) { pad.addEventListener(t, function () { drawing = false; }); });
      document.getElementById('sign-clear').addEventListener('click', function () {
        if (mode === 'draw') { ctx.clearRect(0, 0, pad.width, pad.height); drawn = false; }
        else nameInput.value = '';
        sync();
      });

      document.querySelectorAll('[data-sign-tab]').forEach(function (tab) {
        tab.addEventListener('click', function () {
          mode = tab.getAttribute('data-sign-tab');
          document.querySelectorAll('[data-sign-tab]').forEach(function (t) { t.setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
          var typing = mode === 'type';
          var field = document.querySelector('[data-sign-type-field]');
          field.classList.toggle('hidden', !typing); field.classList.toggle('flex', typing);
          pad.classList.toggle('hidden', typing);
          preview.classList.toggle('hidden', !typing); preview.classList.toggle('flex', typing);
          sync();
        });
      });
      nameInput.addEventListener('input', sync);
      sync();

      submit.addEventListener('click', function () {
        if (submit.disabled) return;
        SDUK.saveState({ signature: mode === 'draw' ? { mode: 'draw' } : { mode: 'type', name: nameInput.value.trim() } });
        SDUK.go('payment.html');
      });
    });
  </script>
</body>
</html>
