<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
  <script src="../../scripts/onboarding-transitions.js"></script>
  <script src="../../scripts/onboarding-stepper.js"></script>
  <script src="../../scripts/onboarding-mobile-header.js"></script>
  <script src="../../scripts/signature.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Meow+Script&display=swap" rel="stylesheet">
</head>
<!-- SMART Disburse UK · 5. Provide signature — draw or type -->
<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">
    <!-- LEFT SIDEBAR (same as the onboarding flow) -->
    <div class="hidden lg:flex bg-gradient-to-b from-[#1E326F] to-[#090C38] w-[325px] shrink-0 self-stretch flex-col px-10 py-[56px] gap-[35px]">
      <div class="flex h-[60px] w-full max-w-[246px] shrink-0 items-center justify-center rounded-xl border-2 border-dashed border-white/20 bg-white/5" title="Client logo">
        <img alt="" src="../../assets/sd-uk/logo-placeholder.svg" class="size-[30px] opacity-60">
      </div>
      <nav aria-label="Progress" data-ob-stepper></nav>
      <div class="mt-auto flex flex-col items-start justify-center gap-3 self-stretch rounded-lg border border-white/10 p-3">
        <a href="contact.html" class="flex w-full cursor-pointer items-center gap-3 text-left text-white transition-colors hover:text-white/70">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>
          <span class="flex-1 text-xs font-medium">Contact <span data-uk-text="payer.name"></span></span>
        </a>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">
        <div data-ob-content class="flex flex-1 flex-col items-center px-4 pt-10 pb-8 lg:px-10 lg:pt-12">
          <div class="w-full max-w-[640px]">
            <h1 class="text-3xl font-semibold text-gray-900">Sign insurance claim</h1>

            <!-- Classic SD signature step: same tabs, canvas and script (signature.js) -->
            <div class="mt-6">
              <nav aria-label="Tabs" class="flex space-x-4">
                <button id="tab-draw" type="button" aria-current="page" class="rounded-md bg-gray-100 px-3 py-2 text-sm font-medium text-gray-900">Draw</button>
                <button id="tab-type" type="button" class="rounded-md px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">Type</button>
              </nav>
            </div>

            <div id="type-input-wrap" class="mt-6 hidden">
              <label for="fullName" class="block text-sm/6 font-medium text-gray-900">Your Full Name</label>
              <div class="mt-2">
                <input id="fullName" type="text" name="fullName" placeholder="Type your full name" data-uk-value="fullName"
                  class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6" />
              </div>
            </div>

            <div class="relative mt-6 flex h-[296px] w-full flex-col items-center gap-4 self-stretch rounded-2xl border border-gray-200 bg-gray-50 p-4">
              <canvas id="signature-canvas" class="h-full w-full rounded-lg"></canvas>
              <button id="clear-signature" type="button" class="absolute top-4 right-4 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">Clear</button>
            </div>
          </div>
          <div class="mt-auto w-full max-w-[640px] pt-10 pb-6">
            <div class="mt-6 flex items-center gap-6">
              <a href="review.html" class="inline-flex h-11 flex-1 items-center justify-center rounded-md bg-white px-3.5 py-2.5 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">Back</a>
              <button id="next-button" type="button" disabled data-next="payment.html"
                class="inline-flex h-11 flex-1 items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">Sign &amp; Go next</button>
            </div>
          </div>
        </div>
        <div data-uk-footer></div>
      </div>
    </div>
  </div>
  <script>
    // Remember the signature for the rest of the session, as the classic step does.
    SDUK.ready(function () {
      document.getElementById('next-button').addEventListener('click', function () {
        var typed = document.getElementById('type-input-wrap').classList.contains('hidden') === false;
        SDUK.saveState({ signature: typed ? { mode: 'type', name: document.getElementById('fullName').value.trim() } : { mode: 'draw' } });
      }, true);
    });
  </script>
</body>
</html>
