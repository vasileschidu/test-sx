<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review your claim · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
  <script src="../../scripts/onboarding-transitions.js"></script>
  <script src="../../scripts/onboarding-stepper.js"></script>
  <script src="../../scripts/onboarding-mobile-header.js"></script>
</head>
<!-- SMART Disburse UK · 4. Document review — open the claim form, accept or dispute -->
<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">
    <!-- LEFT SIDEBAR (same as the onboarding flow) -->
    <div class="hidden lg:flex bg-gradient-to-b from-[#1E326F] to-[#090C38] w-[325px] shrink-0 self-stretch flex-col px-10 py-[56px] gap-[35px]">
      <div class="flex h-[60px] w-full max-w-[246px] shrink-0 items-center justify-center rounded-xl border-2 border-dashed border-white/20 bg-white/5" title="Client logo">
        <img alt="" src="../../assets/sd-uk/logo-placeholder.svg" class="size-[30px] opacity-60">
      </div>
      <nav aria-label="Progress" data-ob-stepper></nav>
      <div class="mt-auto flex flex-col items-start justify-center gap-3 self-stretch rounded-lg border border-white/10 p-3">
        <a href="contact.html" class="flex w-full cursor-pointer items-center gap-3 text-left text-white transition-colors hover:text-white/70">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>
          <span class="flex-1 text-xs font-medium">Contact <span data-uk-text="payer.name"></span></span>
        </a>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">
        <div data-ob-content class="flex flex-1 flex-col items-center px-4 pt-10 pb-8 lg:px-10 lg:pt-12">
          <div class="flex w-full max-w-[640px] flex-col gap-6">
      <div class="flex flex-col gap-4">
        <h1 class="text-3xl font-semibold leading-9 text-gray-900">Review your claim</h1>
        <p class="text-sm leading-5 text-gray-500">Please tap to review the documents below before proceeding with your payment</p>
      </div>
      <!-- Classic SD attachments list: Review opens the document, "I have read" ticks it -->
      <div class="px-4 py-2 sm:px-0">
        <dt class="text-sm/6 font-medium text-gray-900">Attachments</dt>
        <ul role="list" class="mt-4 divide-y divide-gray-100 rounded-md border border-gray-200">
          <li class="flex items-center justify-between py-4 pr-5 pl-4 text-sm">
            <div class="flex w-0 flex-1 items-center">
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 shrink-0 text-gray-400"><path d="M15.621 4.379a3 3 0 0 0-4.242 0l-7 7a3 3 0 0 0 4.241 4.243h.001l.497-.5a.75.75 0 0 1 1.064 1.057l-.498.501-.002.002a4.5 4.5 0 0 1-6.364-6.364l7-7a4.5 4.5 0 0 1 6.368 6.36l-3.455 3.553A2.625 2.625 0 1 1 9.52 9.52l3.45-3.451a.75.75 0 1 1 1.061 1.06l-3.45 3.451a1.125 1.125 0 0 0 1.587 1.595l3.454-3.553a3 3 0 0 0 0-4.242Z" clip-rule="evenodd" fill-rule="evenodd" /></svg>
              <div class="ml-4 flex min-w-0 flex-1 flex-col">
                <button type="button" data-doc-view class="cursor-pointer truncate text-left font-medium text-gray-900 hover:text-blue-600 hover:underline"><span data-uk-text="claim.document.fileName"></span>.pdf</button>
                <span class="text-xs text-gray-400" data-uk-text="claim.document.size"></span>
              </div>
            </div>
            <div class="ml-4 shrink-0">
              <button type="button" id="doc-open" class="cursor-pointer rounded-md px-2.5 py-1.5 text-sm font-semibold text-blue-600 transition-colors hover:bg-blue-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">Review</button>
              <div id="doc-1-status" class="hidden h-6 shrink-0 items-center"><div class="group grid size-4 grid-cols-1"><input id="doc-1-checkbox" type="checkbox" class="col-start-1 row-start-1 appearance-none rounded-sm border border-gray-300 bg-white checked:border-blue-600 checked:bg-blue-600 indeterminate:border-blue-600 indeterminate:bg-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:border-gray-300 disabled:bg-gray-100 disabled:checked:bg-gray-100 forced-colors:appearance-auto" /><svg viewBox="0 0 14 14" fill="none" class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white"><path d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-0 group-has-checked:opacity-100" /><path d="M3 7H11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-0 group-has-indeterminate:opacity-100" /></svg></div></div>
            </div>
          </li>
        </ul>
      </div>
          </div>
          <div class="mt-auto flex w-full max-w-[640px] flex-col gap-4 pt-10">
        <div class="flex flex-col gap-4">
        <button type="button" id="doc-accept" disabled class="inline-flex h-11 w-full cursor-pointer items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">Accept</button>
        <button type="button" id="doc-dispute" class="inline-flex h-11 w-full cursor-pointer items-center justify-center rounded-md bg-white px-3.5 py-2.5 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">Dispute</button>
        </div>
          </div>
        </div>
        <div data-uk-footer></div>
      </div>
    </div>
  </div>
  <script>
    SDUK.ready(function () {
      var accept = document.getElementById('doc-accept');
      var reviewBtn = document.getElementById('doc-open');
      var status = document.getElementById('doc-1-status');
      var box = document.getElementById('doc-1-checkbox');

      function paint() {
        var ok = !!SDUK.getState().docAccepted;
        reviewBtn.classList.toggle('hidden', ok);
        status.classList.toggle('hidden', !ok);
        status.classList.toggle('flex', ok);
        box.checked = ok;
        SDUK.setEnabled(accept, ok);
      }
      paint();
      box.addEventListener('change', function () { SDUK.saveState({ docAccepted: box.checked }); paint(); });

      // Same dialog as the classic Review Documents step.
      // The file name opens the document any time, even once it is ticked (as in Get Paid).
      function openDoc() {
        var pages = '';
        for (var i = 1; i <= SDUK.data.claim.document.pages; i++) {
          pages += '<img alt="Page ' + i + '" loading="lazy" src="' + SDUK.assets + 'claim-form/page-' + i + '.jpg" class="w-full bg-white shadow-sm">';
        }
        var panel = SDUK.modal({ bare: true, size: 'sm:w-full sm:max-w-4xl', html:
          '<div class="border-b border-gray-200 px-6 py-4"><h3 class="text-xl font-semibold text-gray-900">Review Document</h3></div>' +
          '<div class="px-6 py-5"><div class="flex h-[60vh] w-full flex-col gap-6 overflow-y-auto rounded-md border border-gray-200 bg-gray-100 p-6">' + pages + '</div></div>' +
          '<div class="border-t border-gray-200 px-6 py-4"><div class="flex justify-end">' +
            '<button type="button" data-read class="inline-flex cursor-pointer items-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">I have read</button>' +
          '</div></div>' });
        panel.querySelector('[data-read]').addEventListener('click', function () {
          SDUK.saveState({ docAccepted: true });
          SDUK.closeModal();
          paint();
        });
      }
      reviewBtn.addEventListener('click', openDoc);
      document.querySelector('[data-doc-view]').addEventListener('click', openDoc);

      accept.addEventListener('click', function () { if (!accept.disabled) SDUK.go('sign.html'); });

      document.getElementById('doc-dispute').addEventListener('click', function () {
        SDUK.confirmModal({
          icon: 'warn',
          title: 'Dispute Documents',
          body: '<p>Are you sure you want to dispute the documents?</p><p class="mt-3">The payment request will be cancelled and you’ll need to contact <span class="font-semibold text-gray-900">' + SDUK.data.payer.name + '</span> to receive the payment.</p>',
          cancel: 'Cancel', confirm: 'Dispute', tone: 'danger',
          onConfirm: function () { SDUK.closeModal(); SDUK.go('contact.html'); }
        });
      });
    });
  </script>
</body>
</html>
