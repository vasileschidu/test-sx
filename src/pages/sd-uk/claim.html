<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm it’s you · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
  <script src="../../scripts/onboarding-transitions.js"></script>
  <script src="../../scripts/onboarding-stepper.js"></script>
  <script src="../../scripts/onboarding-mobile-header.js"></script>
</head>
<!-- SMART Disburse UK · 3. Questionary — claim number + postcode -->
<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white lg:h-screen lg:flex-row lg:overflow-hidden">
    <!-- LEFT SIDEBAR (same as the onboarding flow) -->
    <div class="hidden lg:flex bg-gradient-to-b from-[#1E326F] to-[#090C38] w-[325px] shrink-0 self-stretch flex-col px-10 py-[56px] gap-[35px]">
      <div class="flex h-[60px] w-full max-w-[246px] shrink-0 items-center justify-center rounded-xl border-2 border-dashed border-white/20 bg-white/5" title="Client logo">
        <img alt="" src="../../assets/sd-uk/logo-placeholder.svg" class="size-[30px] opacity-60">
      </div>
      <nav aria-label="Progress" data-ob-stepper></nav>
      <div class="mt-auto flex flex-col items-start justify-center gap-3 self-stretch rounded-lg border border-white/10 p-3">
        <a href="contact.html" class="flex w-full cursor-pointer items-center gap-3 text-left text-white transition-colors hover:text-white/70">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" /></svg>
          <span class="flex-1 text-xs font-medium">Contact <span data-uk-text="payer.name"></span></span>
        </a>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">
        <div data-ob-content class="flex flex-1 flex-col items-center px-4 pt-10 pb-8 lg:px-10 lg:pt-12">
          <div class="flex w-full max-w-[640px] flex-col gap-6">
      <div class="flex flex-col gap-4">
        <h1 class="text-3xl font-semibold leading-9 text-gray-900">Let’s make sure<br>it’s you!</h1>
        <p class="text-sm leading-5 text-gray-500">To collect your <span class="font-semibold text-gray-900">claim payment</span>, please give us a couple details</p>
      </div>
      <form id="claim-form" class="flex flex-col gap-4 rounded-lg border border-gray-200 p-4" autocomplete="off">
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="claim-number" class="text-sm leading-5 text-gray-900">Your claim number</label></div>
            <input id="claim-number" name="claim-number" type="text" inputmode="numeric" placeholder="e.g. 123456789" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="postcode" class="text-sm leading-5 text-gray-900">Your postal code</label></div>
            <input id="postcode" name="postcode" type="text" placeholder="e.g. WA14 2DT" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
      </form>
          </div>
          <div class="mt-auto flex w-full max-w-[640px] flex-col gap-4 pt-10">
        <button type="button" id="claim-next" disabled class="inline-flex h-11 w-full cursor-pointer items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">Next<img alt="" src="../../assets/sd-uk/icon-arrow-right.svg" class="size-5"></button>
          </div>
        </div>
        <div data-uk-footer></div>
      </div>
    </div>
  </div>
  <script>
    SDUK.ready(function () {
      var form = document.getElementById('claim-form');
      var btn = document.getElementById('claim-next');
      var num = document.getElementById('claim-number');
      var pc = document.getElementById('postcode');
      var s = SDUK.getState();
      if (s.claimNumber) num.value = s.claimNumber;
      if (s.postcode) pc.value = s.postcode;
      SDUK.watch(form, btn, function () { return num.value.trim().length >= 6 && pc.value.trim().length >= 5; });
      btn.addEventListener('click', function () {
        if (btn.disabled) return;
        SDUK.saveState({ claimNumber: num.value.trim(), postcode: pc.value.trim().toUpperCase() });
        SDUK.go('review.html');
      });
    });
  </script>
</body>
</html>
