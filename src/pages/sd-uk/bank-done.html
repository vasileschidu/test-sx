<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Successfully Submitted · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
</head>
<!-- SMART Disburse UK · 8.3 Bank transfer submitted + receipt -->
<body class="min-h-screen bg-white font-['Inter'] antialiased">
  <div class="flex min-h-screen w-full flex-col bg-white">
    <main class="flex flex-1 flex-col px-4 pt-14 sm:px-6">
      <div class="mx-auto flex w-full max-w-[480px] flex-col gap-6">
      <div class="flex flex-col items-center gap-2">
        <span class="relative block size-[45px]"><img alt="" src="../../assets/sd-uk/success-check.svg" class="absolute inset-[-35.56%_-55.56%_-75.56%_-55.56%] block max-w-none"></span>
        <h1 class="text-center text-3xl leading-9 text-gray-900">Successfully<br>Submitted!</h1>
      </div>
      <div class="flex flex-col">
      <div class="uk-amount relative flex w-full flex-col items-center overflow-hidden rounded-2xl z-[1]">
        <img alt="" src="../../assets/sd-uk/bubble-1.svg" class="pointer-events-none absolute top-[calc(50%-72px)] left-[calc(50%-113.5px)] size-[162px] max-w-none -translate-x-1/2 -translate-y-1/2 -rotate-[105deg]">
        <img alt="" src="../../assets/sd-uk/bubble-2.svg" class="pointer-events-none absolute top-[calc(50%+95.81px)] left-[calc(50%-109.55px)] size-[117px] max-w-none -translate-x-1/2 -translate-y-1/2 -rotate-[105deg]">
        <img alt="" src="../../assets/sd-uk/bubble-3.svg" class="pointer-events-none absolute top-[calc(50%+27.25px)] left-[calc(50%+161.16px)] size-[147px] max-w-none -translate-x-1/2 -translate-y-1/2 -rotate-[105deg]">
        <div class="relative flex flex-col items-center gap-3 px-5 py-6">
          <p class="text-xs leading-4 font-medium tracking-[0.6px] text-blue-200 uppercase">payment amount</p>
          <p class="flex text-5xl leading-[48px]"><span class="text-white" data-uk-text="amountWhole">£475</span><span class="text-blue-500" data-uk-text="amountPence">.00</span></p>
          <button type="button" data-uk-eta class="flex cursor-pointer items-center gap-1.5 rounded-full whitespace-nowrap bg-blue-800 py-1 pr-1 pl-3 sm:pl-4"><span class="text-[10px] leading-4 font-medium tracking-[0.5px] text-blue-400 uppercase sm:tracking-[0.7px]"><span class="hidden sm:inline">Estimated </span>Processing Time:</span><span class="flex items-center gap-0.5 rounded-full bg-amber-500 py-0.5 pr-1.5 pl-1"><img alt="" src="../../assets/sd-uk/badge-check.svg" class="size-3.5"><span class="text-xs leading-4 text-white">Up to 3 Days</span></span><img alt="" src="../../assets/sd-uk/info-circle-blue.svg" class="size-5"></button>
        </div>
      </div>
      <div class="mx-4 flex flex-col border-x border-b border-gray-300 bg-white pt-4">
        <div class="flex flex-col gap-4 px-4">
          <div class="flex flex-col gap-3">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Full Name</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="fullName"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Sort Code</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="sortEnding"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Account Number</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="accountEnding"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Receipt Date</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="receipt.date"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Transaction ID</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="receipt.bankTransactionId"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Client Payment Reference ID</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="receipt.clientReferenceId"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line-solid.svg" class="h-px w-full">
            <p class="text-base leading-6 font-semibold text-gray-900" data-uk-text="payer.name"></p>
          </div>
        </div>
        <img alt="" src="../../assets/sd-uk/receipt-edge.svg" class="mt-3 h-[25px] w-full">
      </div>
      </div>
      <div class="flex flex-col gap-4 pt-6">
        <button type="button" data-download class="flex h-14 w-full cursor-pointer items-center justify-center gap-2 rounded-md bg-blue-600 px-3.5 text-base font-semibold text-white shadow-xs hover:bg-blue-500"><img alt="" src="../../assets/sd-uk/icon-download.svg" class="size-5">Download Receipt</button>
        <a href="../../../index.html" data-finish class="flex h-14 w-full items-center justify-center rounded-md border border-gray-300 bg-white px-3.5 text-base font-semibold text-gray-700 shadow-xs hover:bg-gray-50">Finish and Close</a>
      </div>
      <div data-uk-footer></div>
      </div>
    </main>
  </div>
  <script>
    SDUK.ready(function () {
      document.querySelector('[data-download]').addEventListener('click', function () { window.print(); });
      document.querySelector('[data-finish]').addEventListener('click', function () { SDUK.resetState(); });
    });
  </script>
  <script>
    SDUK.ready(function () {
      document.querySelector('[data-uk-eta]').addEventListener('click', function () { SDUK.infoModal('Estimated processing time', '<p>Most UK bank transfers arrive the same day through Faster Payments. Allow up to 3 working days.</p>'); });
    });
  </script>
</body>
</html>
