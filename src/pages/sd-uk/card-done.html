<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Created · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
</head>
<!-- SMART Disburse UK · 7.2 Virtual card created + receipt -->
<body class="min-h-screen bg-white font-['Inter'] antialiased">
  <div class="flex min-h-screen w-full flex-col bg-white">
    <main class="flex flex-1 flex-col px-4 pt-14 sm:px-6">
      <div class="mx-auto flex w-full max-w-[480px] flex-col gap-6">
      <div class="flex flex-col items-center gap-2">
        <span class="relative block size-[45px]"><img alt="" src="../../assets/sd-uk/success-check.svg" class="absolute inset-[-35.56%_-55.56%_-75.56%_-55.56%] block max-w-none"></span>
        <h1 class="text-center text-3xl leading-9 text-gray-900">Card Created!</h1>
      </div>
      <div class="flex flex-col items-center gap-4">
        <div class="uk-mono relative h-[219px] w-full max-w-[344px] overflow-hidden rounded-[10px] bg-gradient-to-b from-[#1e326f] to-[#090c38] text-white shadow-[0_20px_50px_-12px_rgba(0,0,0,0.25)]">
          <span class="absolute top-5 right-5 rounded-full bg-white/20 pr-1.5 pb-px pl-2 text-xs leading-4">CVC2: <span data-uk-text="card.cvc"></span></span>
          <p class="absolute top-[50px] left-5 font-['Inter'] text-[27px] leading-[46px] font-semibold" data-uk-text="amount"></p>
          <span class="absolute top-[81px] right-6 text-xs font-semibold">debit</span>
          <p class="absolute top-[97px] left-5 text-[22px] leading-[25px]" data-uk-text="card.number"></p>
          <p class="absolute top-[133px] left-[105px] flex items-center gap-2"><span class="text-[10px] leading-[10.8px] font-semibold">VALID<br>THRU</span><span class="text-sm" data-uk-text="card.expiry"></span></p>
          <p class="absolute bottom-[22px] left-5 text-sm font-semibold uppercase" data-uk-text="fullName"></p>
          <img alt="" src="../../assets/sd-uk/mastercard.svg" class="absolute right-5 bottom-[20px] h-[32px] w-[52px]">
        </div>
        <img alt="Add to Apple Wallet" src="../../assets/sd-uk/apple-wallet.svg" class="h-11 w-[142px] rounded-md">
        <div class="flex w-full max-w-[344px] flex-col">
          <button type="button" data-save-card class="flex h-14 w-full cursor-pointer items-center justify-center gap-2 rounded-md bg-blue-600 px-3.5 text-base font-semibold text-white shadow-xs hover:bg-blue-500"><img alt="" src="../../assets/sd-uk/icon-download.svg" class="size-5">Save Card Details</button>
          <div class="flex flex-col gap-4 border-x border-gray-300 px-4 pt-4">
            <div class="flex flex-col gap-4 rounded-md bg-gray-50 px-4 py-5 text-center">
              <p class="text-sm leading-5 text-gray-500">Here's your brand new Virtual Card, loaded with your <span class="font-semibold text-gray-800" data-uk-text="amount"></span>.</p>
              <button type="button" data-how-to-use class="cursor-pointer text-sm leading-5 font-medium text-[#3671fb] hover:underline">How you can use your Virtual Card</button>
            </div>
            <p class="flex items-center justify-center gap-2 text-xs leading-[18px] text-gray-500"><img alt="" src="../../assets/sd-uk/icon-trademark.svg" class="size-[13px]">Trademark Disclaimer</p>
          </div>
      <div class="flex w-full flex-col border-x border-b border-gray-300 bg-white">
        <div class="flex flex-col gap-4 px-4">
          <div class="flex flex-col gap-3">
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Full Name</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="fullName"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Billing Address</p>
              <p class="text-base leading-6 break-all text-gray-900 whitespace-pre-line" data-uk-text="addressLines"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Contact Info</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="claimant.phone"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Receipt Date</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="receipt.date"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line.svg" class="h-px w-full">
            <div class="flex w-full flex-col">
              <p class="text-xs leading-4 font-medium text-gray-500">Transaction ID</p>
              <p class="text-base leading-6 break-all text-gray-900" data-uk-text="receipt.cardTransactionId"></p>
            </div>
            <img alt="" src="../../assets/sd-uk/receipt-line-solid.svg" class="h-px w-full">
            <p class="text-base leading-6 font-semibold text-gray-900" data-uk-text="payer.name"></p>
          </div>
        </div>
        <img alt="" src="../../assets/sd-uk/receipt-edge.svg" class="mt-3 h-[25px] w-full">
      </div>
        </div>
      </div>
      <div class="flex flex-col gap-4 pt-6">
        <button type="button" data-download class="flex h-14 w-full cursor-pointer items-center justify-center gap-2 rounded-md bg-blue-600 px-3.5 text-base font-semibold text-white shadow-xs hover:bg-blue-500"><img alt="" src="../../assets/sd-uk/icon-download.svg" class="size-5">Download Receipt</button>
        <a href="../../../index.html" data-finish class="flex h-14 w-full items-center justify-center rounded-md border border-gray-300 bg-white px-3.5 text-base font-semibold text-gray-700 shadow-xs hover:bg-gray-50">Finish and Close</a>
      </div>
      <div data-uk-footer></div>
      </div>
    </main>
  </div>
  <script>
    SDUK.ready(function () {
      document.querySelector('[data-download]').addEventListener('click', function () { window.print(); });
      document.querySelector('[data-finish]').addEventListener('click', function () { SDUK.resetState(); });
    });
  </script>
  <script>
    SDUK.ready(function () {
      // Contact info shows phone and email, as in Figma.
      var phone = document.querySelector('[data-uk-text="claimant.phone"]');
      phone.insertAdjacentHTML('afterend', '<p class="text-base leading-6 text-gray-900">' + SDUK.model().claimant.email + '</p>');
      document.querySelector('[data-save-card]').addEventListener('click', function () { SDUK.infoModal('Card details saved', '<p>Your card number, expiry date and CVC2 were saved to this device.</p>'); });
      document.querySelector('[data-how-to-use]').addEventListener('click', function () { SDUK.infoModal('Using your Virtual Card', '<p>Use it anywhere Mastercard is accepted online, or add it to Apple Wallet to pay in store with your phone.</p>'); });
    });
  </script>
</body>
</html>
