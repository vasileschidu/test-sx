<!doctype html>
<html lang="en-GB" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact · SMART Disburse UK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../styles/sd-uk.css">
  <script src="../../data/sd-uk-claim.js"></script>
  <script src="../../scripts/sd-uk-flow.js"></script>
  <script src="../../scripts/onboarding-transitions.js"></script>
  <script src="../../scripts/onboarding-stepper.js"></script>
  <script src="../../scripts/onboarding-mobile-header.js"></script>
</head>
<!-- SMART Disburse UK · 4.4.1 Contact the payer after a dispute -->
<body class="min-h-screen bg-white px-0 antialiased font-['Inter'] lg:bg-gray-200 lg:px-6">
  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white">
    <div data-ob-content class="flex flex-1 flex-col items-center  px-4 py-10 lg:px-10 lg:py-12">
      <div class="flex w-full max-w-[480px] flex-col gap-6">
      <div class="flex flex-col gap-4">
        <h1 class="text-3xl font-semibold leading-9 text-gray-900">Contact <span data-uk-text="payer.name">AT Insurance Ltd.</span></h1>
        <p class="text-sm leading-5 text-gray-500">Please enter your information</p>
      </div>
      <form id="contact-form" class="flex flex-col gap-6" autocomplete="off">
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="c-first" class="text-sm leading-5 text-gray-900">First Name</label></div>
            <input id="c-first" name="c-first" type="text" placeholder="" data-uk-value="claimant.firstName" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="c-last" class="text-sm leading-5 text-gray-900">Last Name</label></div>
            <input id="c-last" name="c-last" type="text" placeholder="" data-uk-value="claimant.lastName" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="c-email" class="text-sm leading-5 text-gray-900">Email</label></div>
            <input id="c-email" name="c-email" type="email" placeholder="" data-uk-value="claimant.email" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="c-phone" class="text-sm leading-5 text-gray-900">Phone Number</label></div>
            <input id="c-phone" name="c-phone" type="tel" placeholder="" data-uk-value="claimant.phone" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between"><label for="c-company" class="text-sm leading-5 text-gray-900">Company</label><span class="text-sm text-gray-500">Optional</span></div>
            <input id="c-company" name="c-company" type="text" placeholder="" autocomplete="off" class="block h-10 w-full rounded-md bg-white px-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 disabled:bg-gray-50 disabled:text-gray-500 sm:text-sm/6">
          </div>
          <div class="flex flex-col gap-2">
            <label for="c-message" class="text-sm leading-5 text-gray-900">Message</label>
            <textarea id="c-message" rows="4" maxlength="255" class="block w-full rounded-md bg-white px-3 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6"></textarea>
            <p class="text-sm leading-5 text-gray-500">Maximum 255 characters</p>
          </div>
      </form>
      <div class="flex flex-col gap-4 pb-10">
        <button type="button" id="contact-send" disabled class="inline-flex h-11 w-full cursor-pointer items-center justify-center gap-x-2 rounded-md bg-blue-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:hover:bg-blue-300">Let’s talk</button>
        <a href="review.html" id="contact-cancel" class="inline-flex h-11 w-full cursor-pointer items-center justify-center rounded-md bg-white px-3.5 py-2.5 text-sm font-semibold text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50">Cancel</a>
      </div>
      </div>
    </div>
    <div data-uk-footer></div>
  </div>
  <script>
    SDUK.ready(function () {
      var form = document.getElementById('contact-form');
      var btn = document.getElementById('contact-send');
      SDUK.watch(form, btn, function () {
        return ['c-first', 'c-last', 'c-email', 'c-phone', 'c-message'].every(function (id) { return document.getElementById(id).value.trim(); });
      });
      btn.addEventListener('click', function () { if (!btn.disabled) SDUK.go('thank-you.html'); });
    });
  </script>
</body>
</html>
