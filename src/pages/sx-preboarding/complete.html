        </div>

        <section aria-labelledby="pb-created-title" class="w-full overflow-hidden rounded-lg border border-gray-200 dark:border-white/10">
          <div class="flex flex-col gap-1 border-b border-gray-200 p-4 dark:border-white/10">
            <h2 id="pb-created-title" class="type-title-card text-default">Account Created</h2>
            <p class="type-description text-secondary">Access the SMART Hub to view payment details.</p>
          </div>
          <dl class="grid grid-cols-2 gap-4 border-b border-gray-200 p-4 dark:border-white/10">
            <dt class="type-body text-tertiary">Username</dt>
            <dd data-pb-username class="min-w-0 type-body break-words text-default">johnny@hotmail.com</dd>

          <div class="p-4">
            <a href="../dashboard/supplier-portal.html" class="inline-flex items-center gap-1 rounded-sm text-sm font-semibold text-blue-600 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">

      <button type="button" data-pb-feedback-close class="rounded-md p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-500 dark:hover:bg-white/10 dark:hover:text-gray-300 cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400"><span class="sr-only">Close</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
    </div>
    <div data-pb-feedback-ask class="flex flex-col items-center gap-4 pt-4 text-center">
      <div class="flex flex-col gap-1 px-4">

        <p class="type-description-small text-tertiary">Let us know about your experience.</p>
      </div>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" class="size-6"><circle cx="12" cy="12" r="9" /><path d="M9 9.5v.5M15 9.5v.5" /><path d="M8 7.5l2 1M16 7.5l-2 1" /><path d="M8.5 16.5c1.8-1.6 5.2-1.6 7 0" /></svg>

            <button type="button" data-pb-face="3" class="flex size-10 cursor-pointer items-center justify-center rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 active:bg-blue-200 dark:bg-blue-500/10 dark:text-blue-400 dark:hover:bg-blue-500/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">
              <span class="sr-only">Neutral</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" class="size-6"><circle cx="12" cy="12" r="9" /><path d="M9 9.5v.5M15 9.5v.5" /><path d="M9 15.5h6" /></svg>

            <button type="button" data-pb-face="4" class="flex size-10 cursor-pointer items-center justify-center rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 active:bg-blue-200 dark:bg-blue-500/10 dark:text-blue-400 dark:hover:bg-blue-500/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">
              <span class="sr-only">Satisfied</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" class="size-6"><circle cx="12" cy="12" r="9" /><path d="M9 9.5v.5M15 9.5v.5" /><path d="M8.5 14.5c1.8 1.4 5.2 1.4 7 0" /></svg>
            </button>
            <button type="button" data-pb-face="5" class="flex size-10 cursor-pointer items-center justify-center rounded-md bg-blue-50 text-blue-600 hover:bg-blue-100 active:bg-blue-200 dark:bg-blue-500/10 dark:text-blue-400 dark:hover:bg-blue-500/20 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">

        <div aria-hidden="true" class="flex justify-between type-caption text-tertiary"><span>Very unsatisfied</span><span>Very satisfied</span></div>
      </div>
    </div>
    <!-- TODO(confirm): Figma has no "after rating" state. -->
    <p data-pb-feedback-thanks hidden tabindex="-1" role="status" class="px-6 pt-4 pb-2 text-center type-title-small text-default focus:outline-none">Thank you for your feedback!</p>
