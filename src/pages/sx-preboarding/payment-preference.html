<body data-pb-step="payment-preference" class="min-h-screen bg-white dark:bg-gray-900 px-0 antialiased font-['Inter'] lg:bg-gray-200 dark:lg:bg-gray-950 lg:px-6">

  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white dark:bg-gray-900 lg:h-screen lg:flex-row lg:overflow-hidden">

    <div data-ob-sidebar data-ob-no-decline></div>

    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <div data-ob-content class="flex flex-1 flex-col gap-14">
          <div class="flex flex-col gap-6 px-4 pt-10 lg:px-14 lg:pt-14">
            <div class="flex w-full flex-col gap-4">
              <h1 class="type-title-page text-default">How would you like to get paid?</h1>
              <p class="type-description text-tertiary">This will be set as the default option for payments - you can change it at any time in SMART Exchange.</p>
            </div>

            <div role="radiogroup" aria-label="Payment method" data-pb-methods class="flex w-full flex-col gap-2">
              <label class="group flex w-full cursor-pointer items-center gap-4 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-gray-900 py-3 pr-4 pl-3 text-left hover:bg-gray-50 dark:hover:bg-white/5 has-checked:border-blue-600 has-checked:ring-1 has-checked:ring-blue-600 has-checked:ring-inset dark:has-checked:border-blue-500 dark:has-checked:ring-blue-500 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-blue-600 dark:has-focus-visible:outline-blue-400">
                <span class="flex min-w-0 flex-1 items-center gap-3">
                  <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-gray-50 dark:bg-white/5">
                    <img src="../../assets/onboarding/icon-card-sparkle-outline.svg" alt="" width="24" height="24" class="size-6">
                  </span>
                  <span class="flex min-w-0 flex-col items-start gap-0.5">
                    <span class="text-sm leading-5 font-semibold text-gray-900 dark:text-white">Accept Payer’s Card</span>
                    <span class="text-xs leading-4 text-gray-500 dark:text-gray-400">No bank account details required, immediate</span>
                  </span>
                </span>
                <input type="radio" name="pb-method" value="card" class="relative size-4 shrink-0 cursor-pointer appearance-none rounded-full border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden not-checked:group-hover:border-gray-400 dark:not-checked:group-hover:border-white/20 checked:border-blue-600 dark:checked:border-blue-500 checked:bg-blue-600 dark:checked:bg-blue-500 focus-visible:outline-none">
              </label>
              <label class="group flex w-full cursor-pointer items-center gap-4 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-gray-900 py-3 pr-4 pl-3 text-left hover:bg-gray-50 dark:hover:bg-white/5 has-checked:border-blue-600 has-checked:ring-1 has-checked:ring-blue-600 has-checked:ring-inset dark:has-checked:border-blue-500 dark:has-checked:ring-blue-500 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-blue-600 dark:has-focus-visible:outline-blue-400">
                <span class="flex min-w-0 flex-1 items-center gap-3">
                  <span class="flex size-8 shrink-0 items-center justify-center rounded-md bg-gray-50 dark:bg-white/5">
                    <img src="../../assets/onboarding/icon-building-library-outline.svg" alt="" width="24" height="24" class="size-6">
                  </span>
                  <span class="flex min-w-0 flex-col items-start gap-0.5">
                    <span class="text-sm leading-5 font-semibold text-gray-900 dark:text-white">Send to Bank Account</span>
                    <span class="text-xs leading-4 text-gray-500 dark:text-gray-400">Typically processed in 1-3 business days</span>
                  </span>
                </span>
                <input type="radio" name="pb-method" value="bank-account" class="relative size-4 shrink-0 cursor-pointer appearance-none rounded-full border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden not-checked:group-hover:border-gray-400 dark:not-checked:group-hover:border-white/20 checked:border-blue-600 dark:checked:border-blue-500 checked:bg-blue-600 dark:checked:bg-blue-500 focus-visible:outline-none">
              </label>
              <label class="group flex w-full cursor-pointer items-center gap-4 rounded-lg border border-gray-200 dark:border-white/10 bg-white dark:bg-gray-900 py-3 pr-4 pl-3 text-left hover:bg-gray-50 dark:hover:bg-white/5 has-checked:border-blue-600 has-checked:ring-1 has-checked:ring-blue-600 has-checked:ring-inset dark:has-checked:border-blue-500 dark:has-checked:ring-blue-500 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-blue-600 dark:has-focus-visible:outline-blue-400">
                <span class="flex min-w-0 flex-1 flex-wrap gap-x-1.5 text-xs leading-4">
                  <span class="font-semibold text-gray-900 dark:text-white">Request a Paper Check</span>
                  <span class="text-gray-500 dark:text-gray-400">(Slowest, approximately 7-10 days)</span>
                </span>
                <input type="radio" name="pb-method" value="check" class="relative size-4 shrink-0 cursor-pointer appearance-none rounded-full border border-gray-300 dark:border-white/10 bg-white dark:bg-white/5 before:absolute before:inset-1 before:rounded-full before:bg-white not-checked:before:hidden not-checked:group-hover:border-gray-400 dark:not-checked:group-hover:border-white/20 checked:border-blue-600 dark:checked:border-blue-500 checked:bg-blue-600 dark:checked:bg-blue-500 focus-visible:outline-none">
              </label>
            </div>
          </div>

          <div class="mt-auto flex px-4 pb-6 lg:px-14 lg:pb-14">
            <div class="flex w-full flex-col-reverse gap-4 lg:grid lg:grid-cols-2 lg:gap-8">
              <button type="button" data-pb-later
                class="flex flex-1 cursor-pointer items-center justify-center rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-900 px-[25px] py-[15px] text-base leading-6 font-medium text-gray-700 dark:text-gray-300 shadow-xs hover:bg-gray-50 dark:hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400">I’ll choose it later</button>
              <button type="button" data-pb-next
                class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-md bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] py-4 pr-[23px] pl-[25px] text-base leading-6 font-medium text-white hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:brightness-100">
                Next
                <img src="../../assets/onboarding/icon-arrow-narrow-right.svg" alt="" width="20" height="20" class="size-5">
              </button>
            </div>
          </div>
        </div>

        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>
  </div>
