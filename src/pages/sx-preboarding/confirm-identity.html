  @file sx-preboarding/confirm-identity.html
  @description Step 1 "Confirm Identity" (Figma 38223:36414 empty, 38223:36386 filled,
    38223:36442 error; m 38223:36514 / 36546 / 36476): Tax ID + Your Vendor ID.
    Wrong answers (all zeros, prototype rule) cost an attempt; the last one goes to
    too-many-attempts.html. Logic: sx-preboarding.js (page "confirm-identity").
-->
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Identity · SMART Exchange</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="../../scripts/theme-init.js?v=20261127sys"></script>
  <script src="../../scripts/sx-region.js?v=20261127rg"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script src="../../scripts/tailwind-theme.js"></script>
  <script src="../../scripts/design-tokens.js"></script>
  <script src="../../scripts/data-source.js"></script>
  <script src="../../scripts/onboarding-transitions.js?v=20261106a"></script>
  <script src="../../scripts/sx-preboarding.js?v=20261127pb"></script>
  <script src="../../scripts/onboarding-sidebar.js?v=20261112cmp"></script>
  <script src="../../scripts/onboarding-field.js?v=20261106a"></script>
  <script src="../../scripts/onboarding-modal.js?v=20261124fix"></script>
  <script src="../../scripts/onboarding-stepper.js?v=20261104a"></script>
  <script src="../../scripts/onboarding-mobile-header.js"></script>
  <link rel="stylesheet" href="../../styles/cursor.css" />
</head>
<body data-pb-step="confirm-identity" class="min-h-screen bg-white dark:bg-gray-900 px-0 antialiased font-['Inter'] lg:bg-gray-200 dark:lg:bg-gray-950 lg:px-6">

  <div class="mx-auto flex min-h-screen w-full max-w-[1024px] flex-col bg-white dark:bg-gray-900 lg:h-screen lg:flex-row lg:overflow-hidden">

    <div data-ob-sidebar data-ob-no-decline></div>

    <div class="flex flex-1 flex-col lg:min-h-0 lg:overflow-y-auto">
      <div class="flex flex-1 flex-col lg:min-h-screen">

        <form data-pb-form novalidate data-ob-content class="flex flex-1 flex-col gap-14">
          <div class="flex flex-col gap-6 px-4 pt-10 lg:px-14 lg:pt-14">
            <div class="flex w-full flex-col gap-4">
              <h1 class="type-title-page text-default">First, let’s make sure it’s you!</h1>
              <p class="type-description text-tertiary">Please provide the details below.</p>
            </div>

            <!-- Fields: rendered by sx-preboarding.js; the alert sits inside the card (Figma) -->
            <div data-pb-identity class="flex w-full flex-col gap-4 rounded-lg border border-default p-4">
              <div data-pb-identity-alert role="alert" hidden class="flex w-full items-start gap-3 rounded-md bg-red-50 p-4 dark:bg-red-500/10">
                <img src="../../assets/onboarding/icon-exclamation-circle-info.svg" alt="" width="20" height="20" class="size-5 shrink-0">
                <p class="flex-1 text-sm leading-5 text-red-800 dark:text-red-300">At least one of the submitted answer(s) is invalid. You have <span data-pb-remaining>2</span> out of <span data-pb-max>3</span> attempts remaining. Please try again.</p>
              </div>
            </div>
          </div>

          <div class="mt-auto flex flex-col items-center gap-6 px-4 pb-6 lg:px-14 lg:pb-14">
            <div class="grid w-full grid-cols-1 gap-8 lg:grid-cols-2">
              <a href="index.html" data-pb-back
                class="hidden flex-1 items-center justify-center rounded-md border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-900 px-[25px] py-[15px] text-base leading-6 font-medium text-gray-700 dark:text-gray-300 shadow-xs hover:bg-gray-50 dark:hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400 lg:flex">Back</a>
              <button type="submit" data-pb-next disabled
                class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-md bg-[linear-gradient(153deg,#3773ff_3.3%,#2254ca_99.2%)] py-4 pr-[23px] pl-[25px] text-base leading-6 font-medium text-white hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:focus-visible:outline-blue-400 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:brightness-100">
                Next
                <img src="../../assets/onboarding/icon-arrow-narrow-right.svg" alt="" width="20" height="20" class="size-5">
              </button>
            </div>
          </div>
        </form>

        <div data-ob-footer class="lg:hidden"></div>
      </div>
    </div>
  </div>
</body>
</html>
