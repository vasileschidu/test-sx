<!--
  @file dashboard/user-profile.html
  @description SMART Hub › Settings › User Management › profile (Figma [REVIEW] User Management,
    section 2. User Profile, states 6.6–6.9). ?id=<userId>; no id = Me. Inline edit of first /
    last name and phone, photo upload / remove. Data: um-store.js (localStorage sx_um_v1).
-->
<!doctype html>
<html class="h-full bg-gray-100 dark:bg-gray-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - User Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="../../../src/scripts/theme-init.js?v=20261109a"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../../scripts/tailwind-theme.js"></script>
    <script src="../../../src/scripts/design-tokens.js"></script>
    <link rel="stylesheet" href="../../../src/styles/cursor.css" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1"
      type="module"
    ></script>

    <script src="../../../src/scripts/sidebar-boot.js"></script>
    <script src="../../../src/scripts/sx-demo-case.js?v=20261106e"></script>
    <script src="../../../src/scripts/app-plans.js?v=20261110-um3"></script>
    <script src="../../../src/scripts/nav-component.js?v=20261110um3"></script>
    <script src="../../../src/scripts/stp-state.js?v=20261106a"></script>
    <script src="../../../src/scripts/app-switch.js"></script>
    <script src="../../../src/scripts/topbar-component.js?v=20261110um3"></script>
    <script src="../../scripts/checkbox-component.js"></script>
    <script src="../../../src/scripts/sidebar.js" defer></script>
    <script src="../../../src/scripts/data-source.js"></script>
    <script src="../../../src/scripts/shared.js?v=20261109a" defer></script>
    <script src="../../../src/scripts/shell-navigation.js?v=20261106c" defer></script>
    <script src="../../../src/scripts/um-store.js?v=20261110p2" defer></script>
    <script src="../../../src/scripts/um-ui.js?v=20261110p2" defer></script>
    <!-- OBField: SMART System text field (input + error states) -->
    <script src="../../scripts/onboarding-field.js" defer></script>
    <script src="../../../src/scripts/user-profile.js?v=20261110z2" defer></script>
    <link rel="stylesheet" href="../../styles/checkbox.css" />
  </head>

  <body class="h-full font-['Inter'] antialiased dark:text-gray-100">
    <div id="app-shell" class="min-h-screen">
      <app-nav></app-nav>

      <div
        id="main-content-wrapper"
        class="min-w-0 min-h-screen flex flex-col lg:pl-[312px]"
      >
        <app-topbar></app-topbar>

        <main class="w-full p-2 lg:p-6">
          <div class="flex flex-col gap-2 lg:gap-6">
            <!-- Tabs card from user-management.html; here the tabs are links, Users is the current one (Figma 6.6) -->
            <div class="rounded-lg bg-white p-4 shadow-sm dark:bg-gray-900">
                            <nav aria-label="User Management" class="flex gap-2">
                <a href="user-management.html" data-um-link aria-current="page" class="group cursor-pointer inline-flex items-center gap-2 rounded-md px-3 py-2 type-label-large text-gray-600 hover:bg-gray-50 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-gray-100 aria-[current=page]:bg-gray-100 aria-[current=page]:text-gray-900 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white dark:active:bg-white/10 dark:aria-[current=page]:bg-white/10 dark:aria-[current=page]:text-white">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6 shrink-0 text-gray-400 group-aria-[current=page]:text-blue-600 dark:text-gray-500 dark:group-aria-[current=page]:text-blue-400"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" /></svg>
                  Users
                </a>
                <a href="user-management.html?tab=roles" data-um-link class="group cursor-pointer inline-flex items-center gap-2 rounded-md px-3 py-2 type-label-large text-gray-600 hover:bg-gray-50 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-gray-100 aria-[current=page]:bg-gray-100 aria-[current=page]:text-gray-900 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-white dark:active:bg-white/10 dark:aria-[current=page]:bg-white/10 dark:aria-[current=page]:text-white">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6 shrink-0 text-gray-400 group-aria-[current=page]:text-blue-600 dark:text-gray-500 dark:group-aria-[current=page]:text-blue-400"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" /></svg>
                  Roles
                </a>
              </nav>
            </div>

            <!-- ===== Profile (Figma 6.6–6.9) ===== -->
            <section id="up-body" aria-busy="true" class="flex flex-col gap-8 rounded-lg bg-white p-4 shadow-sm sm:p-6 dark:bg-gray-900">
              <!-- Header card: avatar + photo badges, name, role, Status / Created On -->
              <div class="flex flex-col gap-6 rounded-lg border border-gray-200 p-4 sm:p-6 lg:flex-row lg:items-center lg:justify-between dark:border-white/10">
                <div class="flex min-w-0 items-center gap-6">
                  <div class="relative shrink-0">
                    <div id="up-avatar"></div>
                    <button id="up-photo-edit" type="button" hidden data-tooltip="Upload photo" aria-label="Upload photo" class="absolute -top-0.5 -right-0.5 inline-flex size-6 cursor-pointer items-center justify-center rounded-full bg-white text-gray-600 shadow-xs ring-1 ring-gray-300 hover:bg-gray-50 hover:text-gray-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-gray-100 dark:bg-gray-800 dark:text-gray-300 dark:ring-white/15 dark:hover:bg-gray-700 dark:hover:text-white">
                      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-3.5"><path d="M2.695 14.762l-1.262 3.155a.5.5 0 0 0 .65.65l3.155-1.262a4 4 0 0 0 1.343-.886L17.5 5.501a2.121 2.121 0 0 0-3-3L3.58 13.419a4 4 0 0 0-.885 1.343Z" /></svg>
                    </button>
                    <button id="up-photo-remove" type="button" hidden data-tooltip="Remove photo" aria-label="Remove photo" class="absolute -right-0.5 -bottom-0.5 inline-flex size-6 cursor-pointer items-center justify-center rounded-full bg-white text-red-600 shadow-xs ring-1 ring-gray-300 hover:bg-red-50 hover:text-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 active:bg-red-100 dark:bg-gray-800 dark:text-red-400 dark:ring-white/15 dark:hover:bg-red-500/15 dark:hover:text-red-300">
                      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-3.5"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 1 0 .23 1.482l.149-.022.841 10.518A2.75 2.75 0 0 0 7.596 19h4.807a2.75 2.75 0 0 0 2.742-2.53l.841-10.52.149.023a.75.75 0 0 0 .23-1.482A41.03 41.03 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4ZM8.58 7.72a.75.75 0 0 0-1.5.06l.3 7.5a.75.75 0 1 0 1.5-.06l-.3-7.5Zm4.34.06a.75.75 0 1 0-1.5-.06l-.3 7.5a.75.75 0 1 0 1.5.06l.3-7.5Z" clip-rule="evenodd" /></svg>
                    </button>
                    <input id="up-photo-input" type="file" accept="image/png,image/jpeg" class="sr-only" tabindex="-1" aria-hidden="true" />
                  </div>
                  <div class="flex min-w-0 flex-col items-start gap-2">
                    <h1 id="up-name" class="max-w-full truncate text-2xl/8 font-semibold text-default"></h1>
                    <span id="up-role" class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 type-label-small text-gray-800 dark:bg-white/10 dark:text-gray-200"></span>
                  </div>
                </div>
                <dl class="grid grid-cols-1 gap-4 sm:flex sm:gap-0 sm:divide-x sm:divide-gray-200 dark:sm:divide-white/10">
                  <div class="flex flex-col gap-1 sm:pr-10">
                    <dt class="type-overline text-tertiary">Status</dt>
                    <dd id="up-status"></dd>
                  </div>
                  <div class="flex flex-col gap-1 sm:pl-10">
                    <dt class="type-overline text-tertiary">Created On</dt>
                    <dd id="up-created" class="type-body-large text-default"></dd>
                  </div>
                </dl>
              </div>

              <!-- Profile Information: label | value | Update, inline edit (Figma 6.7 / 6.8) -->
              <section aria-labelledby="up-info-title" class="flex flex-col">
                <div class="flex flex-col gap-1 border-b border-gray-200 pb-5 dark:border-white/10">
                  <h2 id="up-info-title" class="type-title-card text-default">Profile Information</h2>
                  <p class="type-caption text-tertiary">This information will be displayed publicly so be careful what you share.</p>
                </div>
                <dl id="up-rows" class="divide-y divide-gray-200 dark:divide-white/10"></dl>
              </section>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- ===== Figma 6.9 Remove Image (same destructive confirm as Remove user) ===== -->
    <el-dialog>
      <dialog id="um-photo-dialog" aria-labelledby="um-photo-title" aria-describedby="um-photo-text" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
        <el-dialog-backdrop
          class="fixed inset-0 bg-gray-900/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
        ></el-dialog-backdrop>
        <div tabindex="0" class="flex min-h-full items-end justify-center p-4 focus:outline-none sm:items-center">
          <el-dialog-panel class="relative w-full transform overflow-hidden rounded-lg bg-white text-left shadow-lg ring-1 ring-black/5 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in data-closed:sm:translate-y-0 data-closed:sm:scale-95 dark:bg-gray-900 dark:ring-white/10 sm:max-w-[512px]">
            <div class="flex h-14 items-end justify-end px-4 pt-4"><button type="button" command="close" commandfor="um-photo-dialog" class="inline-flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-500 focus-visible:outline-2 focus-visible:outline-blue-600 dark:text-gray-500 dark:hover:bg-white/10 dark:hover:text-gray-300"><span class="sr-only">Close</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg></button></div>
            <div class="flex flex-col items-center gap-6 px-6 pb-6">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="size-11 text-red-600 dark:text-red-500"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003ZM12 8.25a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75Zm0 8.25a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" clip-rule="evenodd" /></svg>
              <div class="flex w-full flex-col gap-2 text-center">
                <h2 id="um-photo-title" class="text-lg/6 font-semibold text-gray-900 dark:text-white">Remove Image</h2>
                <p id="um-photo-text" class="text-sm/5 text-gray-500 dark:text-gray-400"></p>
              </div>
            </div>
            <div class="flex flex-col gap-4 px-6 pb-6">
              <button id="um-photo-confirm" type="button" class="w-full cursor-pointer rounded-md bg-red-600 px-6 py-3 text-base/6 font-medium text-white shadow-xs hover:bg-red-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-600 active:bg-red-700 dark:bg-red-500 dark:shadow-none dark:hover:bg-red-400">Remove</button>
              <button type="button" command="close" commandfor="um-photo-dialog" class="w-full cursor-pointer rounded-md border border-gray-300 bg-white px-6 py-[11px] text-base/6 font-medium text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-white/10 dark:bg-white/5 dark:text-white dark:hover:bg-white/10">Cancel</button>
            </div>
          </el-dialog-panel>
        </div>
      </dialog>
    </el-dialog>

  </body>
</html>
