<!--
  @file dashboard/consumer-my-cards.html
  @description Consumer Portal — My Cards. The virtual cards a person was issued
    when they claimed Smart Disburse payments to a card: a stacked list (the same
    pattern as Payment Preferences' cards) and a card page with balances,
    details and transaction history. List and card share one page: the card is
    in the URL (?card=…), so back, reload and links all work.
-->
<!doctype html>
<html class="h-full bg-gray-100 dark:bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cards - Consumer Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="../../../src/scripts/theme-init.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
  <style>
    /* Intentional load state: one tone, one radius, one synchronized pulse. */
    :root { --pp-skel: #e8eaed; --pp-skel-strong: #d6dae1; }
    .dark { --pp-skel: rgba(255,255,255,.10); --pp-skel-strong: rgba(255,255,255,.18); }
    .pp-skel { display: block; border-radius: .375rem; background: var(--pp-skel); animation: ppPulse 1.6s ease-in-out infinite; }
    .pp-skel-strong { background: var(--pp-skel-strong); }
    @keyframes ppPulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .pp-skel { animation: none; } }

  </style>

  <script src="../../../src/scripts/sidebar-boot.js"></script>
  <script src="../../../src/scripts/app-plans.js"></script>
  <script src="../../../src/scripts/nav-component.js?v=consumer-help-20261008b"></script>
  <script src="../../../src/scripts/stp-state.js"></script>
  <script src="../../../src/scripts/app-switch.js"></script>
    <script src="../../../src/scripts/topbar-component.js?v=consumer-notifications-20261008b"></script>
  <script src="../../../src/scripts/sidebar.js?v=consumer-help-20261008b" defer></script>
  <script src="../../../src/scripts/data-source.js"></script>
  <script src="../../../src/scripts/shared.js" defer></script>
  <script src="../../../src/scripts/shell-navigation.js?v=consumer-shell-20261002" defer></script>
  <script src="../../../src/scripts/payment-preferences-components.js" defer></script>
  <script src="../../../src/scripts/consumer-my-cards.js" defer></script>
</head>

<body class="h-full font-['Inter'] antialiased dark:text-gray-100">
  <div id="app-shell" class="min-h-screen">
    <app-nav></app-nav>

    <div id="main-content-wrapper" class="min-w-0 min-h-screen flex flex-col lg:pl-[312px]">
      <app-topbar></app-topbar>

      <main class="flex w-full justify-center p-2 sm:p-2 lg:p-4">
        <section class="w-full max-w-[1280px] rounded-none bg-white shadow-sm sm:rounded-lg dark:bg-gray-900">

          <!-- ===== List ===== -->
          <div id="mc-list-view">
            <div class="flex flex-col gap-4 px-4 pt-6 sm:flex-row sm:items-center sm:px-6">
              <h1 class="text-xl font-semibold text-gray-900 dark:text-white">My Cards</h1>
              <div class="flex flex-col gap-3 sm:ml-auto sm:flex-row sm:items-center">
                <label class="flex cursor-pointer items-center gap-2 rounded-lg bg-gray-50 px-3 py-1.5 whitespace-nowrap dark:bg-white/5">
                  <span class="group grid size-4 grid-cols-1">
                    <input id="mc-active-only" type="checkbox"
                      class="col-start-1 row-start-1 appearance-none rounded-sm border border-gray-300 bg-white checked:border-blue-600 checked:bg-blue-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-white/20 dark:bg-white/5 dark:checked:border-blue-500 dark:checked:bg-blue-500" />
                    <svg viewBox="0 0 14 14" fill="none" class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white"><path class="opacity-0 group-has-checked:opacity-100" d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  </span>
                  <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Active only</span>
                </label>
                <div class="relative w-full sm:w-80">
                  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4 text-gray-400 dark:text-gray-500"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" /></svg>
                  </div>
                  <input id="mc-search" type="search" autocomplete="off" placeholder="Search customer" aria-label="Search cards"
                    class="block h-8 w-full rounded-md border-0 bg-white py-0 pr-3 pl-9 text-sm font-medium text-gray-900 shadow-xs ring-1 ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-blue-600 focus:outline-none dark:bg-white/5 dark:text-white dark:ring-white/10 dark:placeholder:text-gray-500 dark:focus:ring-blue-500" />
                </div>
                <div class="flex items-center gap-3">
                  <div class="relative">
                    <button id="mc-filter-btn" type="button" aria-haspopup="true" aria-expanded="false"
                      class="inline-flex cursor-pointer items-center gap-1.5 rounded-md bg-white px-2.5 py-1.5 text-sm font-semibold whitespace-nowrap text-gray-900 shadow-xs inset-ring inset-ring-gray-300 hover:bg-gray-50 dark:bg-white/5 dark:text-white dark:inset-ring-white/10 dark:hover:bg-white/10">
                      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-4"><path d="M10 4.75a.75.75 0 0 1 .75.75v3.75h3.75a.75.75 0 0 1 0 1.5h-3.75v3.75a.75.75 0 0 1-1.5 0v-3.75H5.5a.75.75 0 0 1 0-1.5h3.75V5.5a.75.75 0 0 1 .75-.75Z" /></svg>
                      Filter
                      <span id="mc-filter-count" class="hidden items-center rounded-full bg-gray-50 px-1.5 py-0.5 text-xs font-medium text-gray-600 tabular-nums inset-ring inset-ring-gray-500/10 dark:bg-white/10 dark:text-gray-400"></span>
                    </button>
                    <div id="mc-filter-panel" class="absolute right-0 z-30 mt-2 hidden w-72 overflow-hidden rounded-md bg-white shadow-lg outline-1 outline-black/5 dark:bg-gray-800 dark:outline-white/10"></div>
                  </div>
                </div>
              </div>
            </div>
            <div id="mc-list-body" class="flex flex-col gap-2 p-4 sm:p-6" aria-live="polite"></div>
          </div>

          <!-- ===== Card page ===== -->
          <div id="mc-detail-view" class="hidden" aria-live="polite"></div>

        </section>
      </main>
    </div>
  </div>

  <!-- Dispute contact details -->
  <el-dialog>
    <dialog id="mc-dispute-dialog" aria-labelledby="mc-dispute-title"
      class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
      <el-dialog-backdrop
        class="fixed inset-0 bg-gray-900/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></el-dialog-backdrop>
      <div tabindex="0" class="flex min-h-full items-center justify-center p-3 focus:outline-none sm:p-6">
        <el-dialog-panel
          class="relative w-full max-w-lg transform overflow-hidden rounded-[10px] bg-white text-left shadow-xl transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in data-closed:sm:translate-y-0 data-closed:sm:scale-95 dark:bg-gray-900 dark:ring-1 dark:ring-white/10">
          <div class="flex w-full items-center justify-end px-4 pt-4">
            <button type="button" data-mc-dispute-close aria-label="Close contact details"
              class="flex size-10 cursor-pointer items-center justify-center rounded-md text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:hover:bg-white/10 dark:hover:text-gray-300">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-6" aria-hidden="true"><path d="M6 18L18 6M6 6L18 18" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>
          </div>
          <div class="flex w-full flex-col gap-[25px] px-6 pt-6 pb-6">
            <div class="flex w-full flex-col items-center gap-4">
              <img src="../../../assets/icons/contact-annotation.svg" alt="" aria-hidden="true" />
              <h2 id="mc-dispute-title" class="text-center text-lg/6 font-semibold text-gray-900 dark:text-white">Contact Details</h2>
            </div>
            <div class="flex w-full flex-col gap-3">
              <div class="flex w-full flex-col gap-1 rounded-md bg-gray-50 px-5 py-4 dark:bg-white/5">
                <p class="text-sm/5 font-medium text-gray-900 dark:text-gray-100">Payer Name</p>
                <p id="mc-dispute-payer" class="text-sm/5 font-normal text-gray-700 dark:text-gray-300"></p>
              </div>
              <div class="flex w-full flex-col gap-1 rounded-md bg-gray-50 px-5 py-4 dark:bg-white/5">
                <p class="text-sm/5 font-medium text-gray-900 dark:text-gray-100">Email Address</p>
                <a id="mc-dispute-email" class="w-fit text-sm/5 font-normal text-gray-700 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:text-gray-300"></a>
              </div>
              <div class="flex w-full flex-col gap-1 rounded-md bg-gray-50 px-5 py-4 dark:bg-white/5">
                <p class="text-sm/5 font-medium text-gray-900 dark:text-gray-100">Phone Number</p>
                <a id="mc-dispute-phone" class="w-fit text-sm/5 font-normal text-gray-700 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:text-gray-300"></a>
              </div>
            </div>
          </div>
        </el-dialog-panel>
      </div>
    </dialog>
  </el-dialog>

  <!-- Toast -->
  <div id="mc-toast" role="status" aria-live="polite"
    class="pointer-events-none fixed inset-x-0 bottom-6 z-50 flex translate-y-2 justify-center px-4 opacity-0 transition duration-200 ease-out">
    <div class="pointer-events-auto flex items-center gap-3 rounded-lg bg-gray-900 py-3 pr-3 pl-4 text-sm text-white shadow-lg dark:bg-gray-700">
      <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="size-5 shrink-0 text-green-400"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z" clip-rule="evenodd" /></svg>
      <span id="mc-toast-text"></span>
    </div>
  </div>
</body>
</html>
