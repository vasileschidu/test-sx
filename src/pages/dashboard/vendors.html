<!doctype html>
<html class="h-full bg-gray-100 dark:bg-gray-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendors - Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="../../../src/scripts/theme-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../../scripts/tailwind-theme.js"></script>
    <link rel="stylesheet" href="../../../src/styles/cursor.css" />
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1"
      type="module"
    ></script>

    <script src="../../../src/scripts/sidebar-boot.js"></script>
    <script src="../../../src/scripts/app-plans.js"></script>
    <script src="../../../src/scripts/nav-component.js"></script>
    <script src="../../../src/scripts/stp-state.js"></script>
    <script src="../../../src/scripts/app-switch.js"></script>
    <script src="../../../src/scripts/topbar-component.js"></script>
    <script src="../../scripts/checkbox-component.js"></script>
    <script src="../../../src/scripts/sidebar.js" defer></script>
    <script src="../../../src/scripts/data-source.js"></script>
    <script src="../../../src/scripts/shared.js" defer></script>
    <script src="../../../src/scripts/shell-navigation.js" defer></script>
    <script src="../../../src/scripts/table-skeleton.js" defer></script>
    <script src="../../../src/scripts/vendors-data.js" defer></script>
    <script src="../../../src/scripts/table-ui.js?v=20261006f" defer></script>
    <script src="../../../src/scripts/vendors-page.js" defer></script>
      <link rel="stylesheet" href="../../styles/checkbox.css" />
  </head>

  <body class="h-full font-['Inter'] antialiased dark:text-gray-100">
    <div id="app-shell" class="min-h-screen">
      <app-nav></app-nav>

      <div
        id="main-content-wrapper"
        class="min-w-0 min-h-screen flex flex-col lg:pl-[312px]"
      >
        <app-topbar></app-topbar>

        <main class="w-full p-2 lg:p-6">
          <div
            class="rounded-none bg-white shadow-sm sm:rounded-lg dark:bg-gray-900"
          >
            <div class="px-4 pt-6 sm:px-6">
              <div
                class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
              >
                <div class="flex items-center gap-12">
                  <div class="flex flex-col gap-1">
                    <h1
                      class="text-lg/6 font-medium whitespace-nowrap text-gray-900 dark:text-white"
                    >
                      Vendors
                    </h1>
                    <p
                      id="vendors-count"
                      class="text-xs/4 whitespace-nowrap text-gray-500 dark:text-gray-400"
                    ></p>
                  </div>
                  <button
                    id="vendors-refresh-btn"
                    type="button"
                    class="inline-flex cursor-pointer items-center gap-1 rounded bg-gray-100 px-2 py-1 text-sm/5 font-semibold text-gray-600 hover:bg-gray-200 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:bg-white/10 dark:text-gray-300 dark:hover:bg-white/15"
                  >
                    <img
                      src="../../../src/assets/vendors/refresh.svg"
                      alt=""
                      width="18"
                      height="18"
                    />
                    Refresh
                  </button>
                </div>
                <div class="grid w-full grid-cols-1 sm:w-[310px]">
                  <input
                    id="vendors-search-input"
                    type="text"
                    role="searchbox"
                    autocomplete="off"
                    placeholder="Search"
                    aria-label="Search vendors"
                    class="col-start-1 row-start-1 block h-10 w-full rounded-md bg-white py-2 pr-3 pl-10 text-base text-gray-900 shadow-xs outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500"
                  />
                  <img
                    src="../../../src/assets/vendors/search.svg"
                    alt=""
                    width="20"
                    height="20"
                    class="pointer-events-none col-start-1 row-start-1 ml-3 self-center"
                  />
                </div>
              </div>
              <div class="mt-4 h-px bg-gray-200 dark:bg-white/10"></div>
            </div>

            <div class="px-4 sm:px-6">
              <div data-table-scroll class="overflow-x-auto xl:overflow-visible">
                <table
                  id="vendors-table"
                  class="w-[1300px] table-fixed border-separate border-spacing-0 xl:w-full"
                ></table>
              </div>
            </div>

            <div
              data-vendors-pagination
              class="mt-6 border-t border-gray-200 py-4 pr-6 pl-4 dark:border-white/10"
            ></div>
          </div>
        </main>
      </div>
    </div>
    <!-- ===== Figma "Vendor List" › Network Search and Invite ===== -->
    <el-dialog>
      <dialog id="vn-invite-dialog" aria-labelledby="vn-invite-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
        <el-dialog-backdrop
          class="fixed inset-0 bg-gray-900/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
        ></el-dialog-backdrop>
        <div tabindex="0" class="flex min-h-full items-end justify-center p-4 focus:outline-none sm:items-center">
          <el-dialog-panel class="relative w-full transform overflow-hidden rounded-lg bg-white text-left shadow-lg ring-1 ring-black/5 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in data-closed:sm:translate-y-0 data-closed:sm:scale-95 dark:bg-gray-900 dark:ring-white/10 flex h-[656px] max-h-[calc(100vh-2rem)] flex-col sm:max-w-[800px]">
            <div class="flex shrink-0 items-center gap-6 border-b border-gray-200 py-3 pr-4 pl-6 dark:border-white/10">
              <h2 id="vn-invite-title" class="flex-1 text-lg/6 font-medium text-gray-900 dark:text-white">Network Search and Invite</h2>
              <button type="button" command="close" commandfor="vn-invite-dialog" class="inline-flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-600 dark:hover:bg-white/10"><span class="sr-only">Close</span><img src="../../../src/assets/vendors/modal-close.svg" alt="" width="24" height="24" /></button>
            </div>
            <div id="vn-invite-body" class="flex min-h-0 flex-1 flex-col"></div>
            <div class="flex shrink-0 gap-6 border-t border-gray-200 px-6 py-5 dark:border-white/10">
              <button type="button" command="close" commandfor="vn-invite-dialog" class="flex-1 cursor-pointer rounded-md border border-gray-300 bg-white px-3.5 py-[9px] text-base/6 font-semibold text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-white/10 dark:bg-white/5 dark:text-white dark:hover:bg-white/10">Cancel</button>
              <button id="vn-invite-confirm" type="button" disabled class="flex-1 cursor-pointer rounded-md bg-blue-600 px-3.5 py-2.5 text-base/6 font-semibold text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:shadow-none disabled:hover:bg-blue-600">Confirm</button>
            </div>
          </el-dialog-panel>
        </div>
      </dialog>
    </el-dialog>

    <!-- ===== Figma "Invitation sent" / "Profile Confirmed" ===== -->
    <el-dialog>
      <dialog id="vn-result-dialog" aria-labelledby="vn-result-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
        <el-dialog-backdrop
          class="fixed inset-0 bg-gray-900/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
        ></el-dialog-backdrop>
        <div tabindex="0" class="flex min-h-full items-end justify-center p-4 focus:outline-none sm:items-center">
          <el-dialog-panel class="relative w-full transform overflow-hidden rounded-lg bg-white text-left shadow-lg ring-1 ring-black/5 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in data-closed:sm:translate-y-0 data-closed:sm:scale-95 dark:bg-gray-900 dark:ring-white/10 sm:max-w-[600px]">
            <div class="flex h-14 items-end justify-end px-4 pt-4"><button type="button" command="close" commandfor="vn-result-dialog" class="inline-flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-600 dark:hover:bg-white/10"><span class="sr-only">Close</span><img src="../../../src/assets/vendors/modal-close.svg" alt="" width="24" height="24" /></button></div>
            <div class="flex flex-col items-center gap-8 px-6 pb-6">
              <img id="vn-result-icon" src="" alt="" width="44" height="44" />
              <div class="flex w-full flex-col gap-2 text-center">
                <h2 id="vn-result-title" class="text-lg/6 font-semibold text-gray-900 dark:text-white"></h2>
                <p id="vn-result-text" class="text-sm/5 text-gray-500 dark:text-gray-400"></p>
              </div>
            </div>
            <div class="px-6 pb-6"><button type="button" command="close" commandfor="vn-result-dialog" class="w-full cursor-pointer rounded-md bg-blue-600 px-6 py-3 text-base/6 font-medium text-white shadow-xs hover:bg-blue-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">Done</button></div>
          </el-dialog-panel>
        </div>
      </dialog>
    </el-dialog>

    <!-- ===== Figma "Re-send/Send link request" / "Delete link" ===== -->
    <el-dialog>
      <dialog id="vn-confirm-dialog" aria-labelledby="vn-confirm-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
        <el-dialog-backdrop
          class="fixed inset-0 bg-gray-900/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
        ></el-dialog-backdrop>
        <div tabindex="0" class="flex min-h-full items-end justify-center p-4 focus:outline-none sm:items-center">
          <el-dialog-panel class="relative w-full transform overflow-hidden rounded-lg bg-white text-left shadow-lg ring-1 ring-black/5 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in data-closed:sm:translate-y-0 data-closed:sm:scale-95 dark:bg-gray-900 dark:ring-white/10 sm:max-w-[512px]">
            <div class="flex h-14 items-end justify-end px-4 pt-4"><button type="button" command="close" commandfor="vn-confirm-dialog" class="inline-flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-600 dark:hover:bg-white/10"><span class="sr-only">Close</span><img src="../../../src/assets/vendors/modal-close.svg" alt="" width="24" height="24" /></button></div>
            <div class="flex flex-col items-center gap-6 px-6 pb-6">
              <img id="vn-confirm-icon" src="" alt="" width="44" height="44" />
              <div class="flex w-full flex-col gap-2 text-center">
                <h2 id="vn-confirm-title" class="text-lg/6 font-semibold text-gray-900 dark:text-white"></h2>
                <p id="vn-confirm-text" class="text-sm/5 text-gray-500 dark:text-gray-400"></p>
              </div>
            </div>
            <div class="flex flex-col gap-4 px-6 pb-6">
              <button id="vn-confirm-ok" type="button" class="w-full cursor-pointer rounded-md px-6 py-3 text-base/6 font-medium text-white shadow-xs focus-visible:outline-2 focus-visible:outline-offset-2"></button>
              <button id="vn-confirm-cancel" type="button" command="close" commandfor="vn-confirm-dialog" class="w-full cursor-pointer rounded-md border border-gray-300 bg-white px-6 py-[11px] text-base/6 font-medium text-gray-700 shadow-xs hover:bg-gray-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 dark:border-white/10 dark:bg-white/5 dark:text-white dark:hover:bg-white/10"></button>
            </div>
          </el-dialog-panel>
        </div>
      </dialog>
    </el-dialog>
  </body>
</html>
