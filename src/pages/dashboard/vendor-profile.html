<!doctype html>
<html class="h-full bg-gray-100 dark:bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Profile - Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="../../../src/scripts/theme-init.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>

  <script src="../../../src/scripts/sidebar-boot.js"></script>
  <script src="../../../src/scripts/nav-component.js"></script>
  <script src="../../../src/scripts/stp-state.js"></script>
  <script src="../../../src/scripts/topbar-component.js"></script>
  <script src="../../../src/scripts/sidebar.js" defer></script>
  <script src="../../../src/scripts/shared.js" defer></script>
  <script src="../../../src/scripts/shell-navigation.js" defer></script>
  <script src="../../../src/scripts/vendors-data.js" defer></script>
  <script src="../../../src/scripts/payment-preferences-components.js" defer></script>
  <script src="../../../src/scripts/vendor-profile-page.js" defer></script>
</head>

<body class="h-full font-['Inter'] antialiased dark:text-gray-100">
  <div id="app-shell" class="min-h-screen">
    <app-nav></app-nav>

    <div id="main-content-wrapper" class="min-w-0 min-h-screen flex flex-col lg:pl-[288px]">
    <app-topbar></app-topbar>

    <main id="vendor-profile-main" class="flex w-full justify-center p-2 sm:p-2 lg:p-4">
      <section class="w-full max-w-[1280px] overflow-hidden rounded-none bg-white shadow-sm sm:rounded-lg dark:bg-gray-900">
        <div class="pt-6 sm:pt-7">
          <div class="px-4 pb-6 sm:px-6 lg:px-8">
            <div class="flex min-w-0 flex-1 flex-col gap-6">
              <div class="flex min-w-0 flex-col gap-6">
                <div class="flex flex-wrap items-center gap-4">
                  <h1 id="vendor-profile-name" class="text-2xl font-semibold tracking-tight text-gray-900 dark:text-white">Loading vendor...</h1>
                  <button id="vendor-profile-vendor-id-button" type="button" data-copy-id="vendor-profile-vendor-id-copy-source"
                    class="copy-btn relative inline-flex h-[28px] items-center rounded-md bg-gray-50 pl-2 pr-8 text-xs font-medium leading-5 text-gray-600 inset-ring inset-ring-gray-500/10 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:bg-white/10 dark:text-gray-300 dark:inset-ring-white/15 dark:hover:bg-white/15 dark:hover:text-white cursor-pointer">
                    <span id="vendor-profile-vendor-id" class="font-['Roboto_Mono'] leading-5"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="pointer-events-none absolute right-2 top-1/2 size-3.5 -translate-y-1/2 text-gray-400 dark:text-gray-500">
                      <path d="M7 3.5A1.5 1.5 0 0 1 8.5 2h3.879a1.5 1.5 0 0 1 1.06.44l3.122 3.12A1.5 1.5 0 0 1 17 6.622V12.5a1.5 1.5 0 0 1-1.5 1.5h-1v-3.379a3 3 0 0 0-.879-2.121L10.5 5.379A3 3 0 0 0 8.379 4.5H7v-1Z" />
                      <path d="M4.5 6A1.5 1.5 0 0 0 3 7.5v9A1.5 1.5 0 0 0 4.5 18h7a1.5 1.5 0 0 0 1.5-1.5v-5.879a1.5 1.5 0 0 0-.44-1.06L9.44 6.439A1.5 1.5 0 0 0 8.378 6H4.5Z" />
                    </svg>
                  </button>
                  <div id="vendor-profile-status-badge"></div>
                </div>
                <div id="vendor-profile-meta" class="flex flex-wrap items-center gap-x-8 gap-y-4"></div>
                <span id="vendor-profile-vendor-id-copy-source" class="sr-only"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="px-4 py-8 sm:px-6 lg:px-8">
          <div class="grid grid-cols-1 gap-x-8 gap-y-10 xl:grid-cols-3">
            <div id="vendor-profile-left-column" class="flex flex-col gap-10 xl:col-span-2">
              <section id="vendor-profile-overview"></section>
              <section id="vendor-profile-methods"></section>
              <section id="vendor-profile-payables"></section>
              <section id="vendor-profile-remittance"></section>
              <section id="vendor-profile-tax"></section>
              <section id="vendor-profile-documents"></section>
              <section id="vendor-profile-notes"></section>
            </div>

            <aside id="vendor-profile-right-column" class="flex flex-col gap-10">
              <section id="vendor-profile-contact"></section>
              <section id="vendor-profile-health"></section>
              <section id="vendor-profile-addresses"></section>
              <section id="vendor-profile-recent-activity"></section>
              <section id="vendor-profile-audit-log"></section>
            </aside>
          </div>
        </div>
      </section>
    </main>
    </div>
  </div>
</body>
</html>
