                      <input

                        type="text"
                        role="searchbox"
                        autocomplete="off"
                        placeholder="Search"
                        aria-label="Search users"
                        class="col-start-1 row-start-1 block h-10 w-full rounded-md bg-white py-2 pr-3 pl-10 text-base text-gray-900 shadow-xs outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 sm:text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500"

                   pinned on the right (same principle as Bills/Payables). -->
